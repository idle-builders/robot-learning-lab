    doc: 'Torso core: the stage-1 chassis with the hip yaw, shoulder pitch and neck yaw servos, battery cells with insulators and fins, power
      and compute electronics and their carriers (everything on the torso link but the body shells). Before anything goes on, the 2 brass
      M3 x 4 heat-set inserts of the neck anchor are pressed into the chassis pad from its rear face (+y, the cradle''s seat; nothing behind
      it on the bare chassis), flush; trim any melt ridge on that face (T-jxshhv).'
