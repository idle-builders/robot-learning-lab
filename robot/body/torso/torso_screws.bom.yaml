# APE0 body definition for robot/body/torso/torso_screws.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: torso-screws
owner: (set by the owning session)
generators:
- id: torso-screws
  command:
  - .venv/bin/python
  - -B
  - robot/body/torso/torso_screws.py
  - build
  inputs:
  - artifacts/robot/body/torso/combined
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - artifacts/cove50-strength/complete-fdm-body-20261106/parts/combined__stage1_center_torso_spine_chassis_steel_sleeves.step
  - artifacts/cove50-strength/fdm-body-motor-refit/parts/combined__stage1_center_torso_spine_chassis.step
  - robot/body/neck-head/neck_anchor.json
  outputs:
  - artifacts/robot/body/torso/torso-screws/records.json
  - artifacts/robot/body/torso/torso-screws/parts
  notes: Rebuilt stage 3 torso carrier + sleeves (T-nh6ytf) that roll_flip_checks manifest swaps in; until 2026-11-20 the copy read the main checkout's
    records through the torso link. Since 2026-11-22 (T-bv7bwe) it also writes the threaded stage-1 interface sleeves, their screws and the stage-1
    clearance sleeve part without those positions (from the shell-pass manifest's stage-1 sleeve STEP). Since T-htfaaz it also rebuilds the stage
    4 IMU/ADC carrier + its 6 rail sleeves (outer face on the boards, rail sites from common.stage4_rail_sites), the 8 PA2 board screws, and Stage
    1 with the bores of the two moved stage 4 rail sites (stage-1 body and its sleeve STEP read from the shell-pass manifest). Since T-jxshhv
    Stage 1 also carries the neck anchor pad (2 brass M3 heat-set inserts in the stage-1 sleeve part, the 2 old anchor sleeves dropped;
    robot/body/neck-head/neck_anchor.json).
  after:
  - shell-pass
parts:
- match: combined__stage1_center_torso_spine_chassis
  kind: printed
  line: print:combined__stage1_center_torso_spine_chassis
  name: combined__stage1_center_torso_spine_chassis
  make_buy: make
  quantity: 1
  process:
    printer: Bambu X2D
    material: Bambu PAHT-CF
    layer_normal_axes:
    - y
    up: -z
    material_alternatives:
    - Bambu PETG-CF
    seeded: 'up from manifest print_orientation ''XY Vertical Honeycomb Magazine & Actuator Cheeks Upright on Build Plat''; chosen by bed contact,
      then least overhang (bed mm2, overhang>45deg mm2) {''+z'': (99.1, 4589.0), ''-z'': (140.7, 4471.1)}; the text writes +z, the estimate differs'
    seeded_keys:
    - up
  loadpath_slices:
    axis: z
    range_mm:
    - 274.0
    - 365.0
    n_slices: 12
    set_by: 'builder/opus 2026-11-19: dominant axis and span between the centroids of the FEM support holes and load holes (first reading, not
      designer-confirmed)'
  fem:
    _doc: 'Torso stage 1 spine chassis (old torso fem_evaluate stage1_center_torso_spine_chassis, LOAD_CASES incl. the combined bilateral shoulder
      + hip yaw + neck stall). Supports: the 8 hip-yaw C047 case mount sleeve sites (both sides) at the lower yaw servo case references; load:
      the shoulder-pitch C047 case sleeve sites (both sides), the neck-yaw XM335 case sites and the neck root cradle anchor sites. Force + moment
      as a wrench at the load patch centroid (the old script spread the moment as a force couple over the load nodes with a lever of 121 mm and
      a stage-volume factor). Steel collars 0.7 mm around every sleeve bore of the chassis. The sleeve sites sit 2.4 mm (hip yaw case) and 3.0-3.3
      mm (shoulder pitch case) from the servo case surfaces (3 mm mount spacers), hence gap 3.5 mm.'
    mesh_h_mm: 2.2
    origin_mm: load_centroid
    materials:
    - Bambu PAHT-CF
    - Bambu PETG-CF
    regions:
    - material: Steel 304 sleeve
      where:
        bore_collars:
          of: combined__stage1_center_torso_spine_chassis_steel_sleeves
          r_extra_mm: 0.7
          end_extra_mm: 0.25
    supports:
      hip_yaw_case_mounts:
        holes:
          of: combined__stage1_center_torso_spine_chassis_steel_sleeves
          mate:
          - lower__L_yaw_servo_case_reference
          - lower__R_yaw_servo_case_reference
          gap_mm: 3.5
          r_max_mm: 5.0
          rim_mm: 2.0
    load:
      holes:
        of: combined__stage1_center_torso_spine_chassis_steel_sleeves
        mate:
        - upper__L_pitch_C047_case
        - upper__R_pitch_C047_case
        - upper__neck_yaw_case_XM335
        - combined__neck_root_cradle
        gap_mm: 3.5
        r_max_mm: 5.0
        rim_mm: 2.0
    load_cases:
      1g_upright_battery_torso:
        wrench_N_Nmm:
        - 0.0
        - 4.5
        - -31.4
        - 420.0
        - 180.0
        - 90.0
      3g_dynamic_gait_arm_swing:
        wrench_N_Nmm:
        - 28.0
        - 34.0
        - -94.2
        - 1650.0
        - 1120.0
        - 780.0
      6g_fall_landing_impact:
        wrench_N_Nmm:
        - 62.0
        - 75.0
        - -188.4
        - 3400.0
        - 2400.0
        - 1650.0
      combined_shoulder_hip_neck_stall:
        wrench_N_Nmm:
        - 95.0
        - 110.0
        - -145.0
        - 8000.0
        - 4800.0
        - 8000.0
    convergence:
      manifest: artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json sha256 068f643641fe3695 (the part's STEP and sleeves
        are identical in the motor-refit manifest it first ran on, sha e8b9ae95)
      result: '2.2 -> 1.6: p99 +4.5..+5.1 %, peak +4.9..+17.6 %, displacement +8.4..+10.1 %; stored h 2.2 (p99 about 5 %)'
      stored_h_rule: first level whose p99 change to the next finer level is < 5 %
