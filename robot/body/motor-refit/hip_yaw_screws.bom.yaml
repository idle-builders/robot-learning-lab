    open_difference: 'Re-proved on the manifest roll-flip df7d03a5e2610e97; load patch RIGID (M-chnfz7) because the mate is the hip pitch servo
      case: all its nodes follow one rigid-body motion, the support is fixed (already rigid). Reaction check: clamped-node reaction + applied
      wrench = 0.001 % of the wrench at the stored h (all cases). rigid load vs the previous loose load at h 0.9 (variant loose_load; all cases
      x materials): p99 -17..+8 %, peak -11..+20 %, displacement -52..-41 %; recovery PAHT-CF p99 54.7 -> 46.2 MPa, displacement 4.65 -> 2.25
