        p99_change_pct: +0.9..+4.0
        peak_change_pct: -36.1..+103.2
        max_displacement_change_pct: +4.6..+6.1
      stored_h_rule: first level from which every step to the next finer level has p99 change < 5 % (all load cases x materials); the peak is
