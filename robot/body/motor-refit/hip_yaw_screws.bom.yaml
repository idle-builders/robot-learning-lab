      be 5-10 % lower. Stored h 0.9: 0.9: p99 +0.9..+4.0 % and displacement +4.6..+6.1 % to the next finer level h 0.7. At the stored h, recovery
      PAHT-CF (layer normal x): p99 46.169 MPa, peak 411.61, displacement 2.249 mm, ratio 1.91 (33723 nodes). The loose-load setup that produced
      the numbers below stays as variant loose_load (history). Earlier notes: legacy_coordinates reproduces the old run on p99 and displacement
      (p99 -0.1..+1.2 %, disp -0.8..+0.3 %, peak +6..+28 %). Stored differs: p99 -22..+9 %, peak +42..+203 %, disp +4..+38 %. One-change solve
      (stored load + legacy supports): p99 -10..+9 %, peak -46..-4 %, disp +39..+52 %, so the hole-based load patch (610 mm2 vs 470, 593 mm2 on
      the low-z side only) drives displacement and the screw-contact supports (1901 mm2 vs 1790, halves 1177 / 724 vs 901 / 889) the peak. Not
      chased further.'
    convergence:
      manifest: 'artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json sha256 df7d03a5e2610e97 (parts unchanged vs 068f643641fe3695
        except the shin: R_thigh_roll_flip, hip pitch, yaw, ankle, foot keep their STEP shas)'
