      p99 +1.8..+6.8 %, disp +4.9..+11.1 %; 1.2->0.9 p99 -0.1..+6.2 %, disp -0.5..+9.4 %; 0.9->0.7 p99 +0.9..+4.0 %, disp +4.6..+6.1 %. Lowest
