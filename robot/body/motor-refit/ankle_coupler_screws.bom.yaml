# Cove-50 body definition for robot/body/motor-refit/ankle_coupler_screws.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: ankle-coupler-screws
owner: (set by the owning session)
generators:
- id: ankle-coupler-screws
  command:
  - .venv/bin/python
  - -B
  - robot/body/motor-refit/ankle_coupler_screws.py
  - build
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  - robot/actuators/interfaces/standard-parts.json
  - robot/body/fastening/connector_screws.json
  outputs:
  - artifacts/robot/body/leg/ankle-coupler-screws/records.json
  - artifacts/robot/body/leg/ankle-coupler-screws/parts
  notes: Edits the coupler STEP named by the roll-flip manifest. Not idempotent if that manifest already carries the edited coupler (it would
    edit the edited part), hence the bootstrap pass before it.
  after:
  - roll-flip-manifest-bootstrap
parts:
- match: R_ankle_coupler_combined
  kind: printed
  line: print:R_ankle_coupler_combined
  name: R_ankle_coupler_combined
  make_buy: make
  quantity: 1
- match: R_ankle_coupler_combined_steel_sleeves
  kind: hardware
  line: steel-sleeve-sets
  name: Steel sleeve sets (CAD parts; the sleeves are bought by size, see contains)
  make_buy: context
  quantity: 1
  contains:
  - line: sleeve:4.5x3.2x2
    name: 304 steel compression sleeve 4.5 x 3.2 x 2 mm (outer x inner x length)
    quantity: 4
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 2.0
    supplier: unknown
    part_number: unknown
  - line: sleeve:4.5x3.2x2.5
    name: 304 steel compression sleeve 4.5 x 3.2 x 2.5 mm (outer x inner x length)
    quantity: 4
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 2.5
    supplier: unknown
    part_number: unknown
  - line: sleeve:4.5x3.2x3
    name: 304 steel compression sleeve 4.5 x 3.2 x 3 mm (outer x inner x length)
    quantity: 4
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 3.0
    supplier: unknown
    part_number: unknown
- match: L_ankle_coupler_combined
  kind: printed
  line: print:L_ankle_coupler_combined
  name: L_ankle_coupler_combined
  make_buy: make
  quantity: 1
- match: L_ankle_coupler_combined_steel_sleeves
  kind: hardware
  line: steel-sleeve-sets
  name: Steel sleeve sets (CAD parts; the sleeves are bought by size, see contains)
  make_buy: context
  quantity: 1
  contains:
  - line: sleeve:4.5x3.2x2
    name: 304 steel compression sleeve 4.5 x 3.2 x 2 mm (outer x inner x length)
    quantity: 4
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 2.0
    supplier: unknown
    part_number: unknown
  - line: sleeve:4.5x3.2x2.5
    name: 304 steel compression sleeve 4.5 x 3.2 x 2.5 mm (outer x inner x length)
    quantity: 4
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 2.5
    supplier: unknown
    part_number: unknown
  - line: sleeve:4.5x3.2x3
    name: 304 steel compression sleeve 4.5 x 3.2 x 3 mm (outer x inner x length)
    quantity: 4
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 3.0
    supplier: unknown
    part_number: unknown
assembly:
  steps:
  - id: right_leg:p036
    subassembly: right_leg
    part:
    - R_ankle_coupler_combined
    - R_ankle_coupler_combined_steel_sleeves
    direction: [0.0, 0.0, 1.0]
    after:
    - right_leg:p035
    status: seeded
    derived: 'graph order, fastened distance 51 from the base; direction: no screw to placed parts: toward the centroid of placed neighbours (R_ankle_pitch_ST3025_output),
      snapped to the nearest axis'
  - id: left_leg:p036
    subassembly: left_leg
    part:
    - L_ankle_coupler_combined
    - L_ankle_coupler_combined_steel_sleeves
    direction: [-0.0, 0.0, 1.0]
    after:
    - left_leg:p035
    status: seeded
    derived: 'mirror of right_leg p34 (R_ <-> L_, x negated): graph order, fastened distance 51 from the base; direction: no screw to placed parts:
      toward the centroid of placed neighbours (R_ankle_pitch_ST3025_output), snapped to the nearest axis'
