assembly:
  steps:
  - id: right_leg:p008
    subassembly: right_leg
    part:
    - R_hip_pitch_to_roll_roll_flip
    - R_hip_pitch_to_roll_roll_flip_steel_sleeves
    direction: [-1.0, 0.0, 0.0]
    after:
    - right_leg:p007
    status: designer
    derived: 'hip order (lead 2026-11-20, roll-flip designer): Stage 5 goes onto the ST3025 output wheel face along -x (its land seats on the
      wheel face x 61.0, the 4 wheel screws run along x from the plate''s outer face); the roll servo is not in yet'
  - id: right_leg:p013
    subassembly: right_leg
    part:
    - R_thigh_roll_flip
    - R_thigh_roll_flip_steel_sleeves
    direction: [0.0, 0.0, 1.0]
    after:
    - right_leg:s012
    status: designer
    derived: 'hip order (lead 2026-11-20, roll-flip designer): the H-cage rises onto the hanging roll case from below (+z), the case''s ear bosses
      pass up its key pockets'
  - id: right_leg:p025
    subassembly: right_leg
    part:
    - R_shin_combined
    - R_shin_combined_steel_sleeves
    direction: [0.0, 1.0, 0.0]
    after:
    - right_leg:p024
    status: seeded
    derived: 'graph order, fastened distance 30 from the base; direction: no screw to placed parts: toward the centroid of placed neighbours (R_knee_ST3025_output),
      snapped to the nearest axis; direction searched (six axes vs the seeded [0.0, 0.0, 1.0]): path contact 19.5 -> 0.0 mm out, seat released
      True -> True, max overlap 19.8 -> 0.0 mm3'
  - id: right_leg:p030
    subassembly: right_leg
    part: R_shin_back_hard_cover
    direction: [0.0, -1.0, 0.0]
    after:
    - right_leg:s029
    status: seeded
    derived: 'shin back cover (thigh_shell.py shin-cover, 2026-11-20 hip fix): a wrap-around cover behind the shin goes on from behind along -y,
      its side wings sliding along the shin frame''s sides; then the 4 PA2x8 through the wings along x (the seeded +x, the mean screw direction,
      pushed the whole cover sideways through the shin); moved after s031 (its part R_shin_back_hard_cover blocked that screw''s driver path,
      9.508 mm3)'
  - id: left_leg:p008
    subassembly: left_leg
    part:
    - L_hip_pitch_to_roll_roll_flip
    - L_hip_pitch_to_roll_roll_flip_steel_sleeves
    direction: [1.0, 0.0, 0.0]
    after:
    - left_leg:p007
    status: seeded
    derived: 'mirror of right_leg p08 (R_ <-> L_, x negated): hip order (lead 2026-11-20, roll-flip designer): Stage 5 goes onto the ST3025 output
      wheel face along -x (its land seats on the wheel face x 61.0, the 4 wheel screws run along x from the plate''s outer face); the roll servo
      is not in yet'
  - id: left_leg:p013
    subassembly: left_leg
    part:
    - L_thigh_roll_flip
    - L_thigh_roll_flip_steel_sleeves
    direction: [-0.0, 0.0, 1.0]
    after:
    - left_leg:s012
    status: seeded
    derived: 'mirror of right_leg p16 (R_ <-> L_, x negated): hip order (lead 2026-11-20, roll-flip designer): the H-cage rises onto the hanging
      roll case from below (+z), the case''s ear bosses pass up its key pockets'
  - id: left_leg:p025
    subassembly: left_leg
    part:
    - L_shin_combined
    - L_shin_combined_steel_sleeves
    direction: [0.0, 1.0, 0.0]
    after:
    - left_leg:p024
    status: seeded
    derived: 'mirror of right_leg p26 (R_ <-> L_, x negated): graph order, fastened distance 30 from the base; direction: no screw to placed parts:
      toward the centroid of placed neighbours (R_knee_ST3025_output), snapped to the nearest axis; direction searched (six axes vs the seeded
      [-0.0, 0.0, 1.0]): path contact 19.5 -> 0.0 mm out, seat released True -> True, max overlap 19.8 -> 0.0 mm3'
  - id: left_leg:p030
    subassembly: left_leg
    part: L_shin_back_hard_cover
    direction: [-0.0, -1.0, 0.0]
    after:
    - left_leg:s029
    status: seeded
    derived: 'mirror of right_leg p27 (R_ <-> L_, x negated): shin back cover (thigh_shell.py shin-cover, 2026-11-20 hip fix): a wrap-around cover
      behind the shin goes on from behind along -y, its side wings sliding along the shin frame''s sides; then the 4 PA2x8 through the wings along
      x (the seeded +x, the mean screw direction, pushed the whole cover sideways through the shin); moved after s031 (its part L_shin_back_hard_cover
      blocked that screw''s driver path, 9.508 mm3)'
defects:
- id: voxel-shells
  kind: no_scripted_step
  parts:
  - center_front_shell
  - center_back_shell
  - '*_foot_boot_shell'
  - '*_foot_sole_shell'
  - '*_thigh_shell_front'
  - '*_thigh_shell_back'
  state: Regenerable by script (ape-proportions/shells.py voxel sweep + marching cubes; leg/thigh_shell.py; ape-proportions/build.py) but mesh
    only by method. The STL prints; the B-rep checks screen them as closed meshes.
  fix: Not a recreation defect. A native STEP needs a B-rep shell method (offset surface or loft of sections) instead of voxels (large); only
    worth it if a check or a supplier needs B-rep.
  effort: large (optional)
