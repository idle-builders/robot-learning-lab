    value: [2.0, 219.0]
    doc: hip pitch axis (y, z); ST3025 output wheel face at x 63.0
  RF_PLATE_X:
    value: [63.0, 71.0]
  RF_PITCH_HUB_R:
    value: 12.6
    doc: 'pitch-wheel hub: the dia 10 anvil disc of each wheel sleeve stays on the part'
  RF_ROLL_HUB_R:
    value: 12.4
    doc: roll horn / idler hub of the arms (was 10.8), same reason
  RF_FRONT_HUB_TOP:
    value: 201.45
    doc: front arm hub top inboard of the neck (yaw-link column at hip pitch -90)
  RF_ROLL_CENTRE_R:
    value: 3.2
    doc: 'front arm centre hole: horn screw head (was 4.2), keeps the anvil discs on material'
  RF_ROLL_CENTRE_R_REAR:
    value: 3.3
    doc: 'rear arm centre hole: 0.3 mm radial clearance to the case''s rear stub (r 3.0); 3.6 left'
  RF_ARM_THICKEN:
    value: 1.5
    doc: '1.15 mm webs to the idler sleeve bores (walls check: under two lines of the 0.6 nozzle) Stage 5 arms grow outward (away from the thigh) beyond the old 3.2 mm layers'
  RF_WING_TOP:
    value: 220.0
    doc: top of the Stage 5 plate wings at the arm layers (was z_low + 7.5)
  RF_CLEAR_R:
    value: 18.0
    doc: Stage 5 stays outside this radius about the roll axis where the case can swing
  RF_KNEE_KEEP:
    value: [20.0, 42.9, -16.5, 30.0, 155.5, 162.8]
    doc: '(rotated case corners reach r 16.0; 2 mm clearance) box of the current thigh kept: end-block end only, above the'
  RF_KNEE_AXIS:
    value: [4.0, 123.0]
    doc: 'old C047 cheek bores (z <= 154.35); the cheek below is new; top at the block''s crossbar top (162.8), not 0.2 mm above it (no 0.2 mm ledges) Knee ST3025 (R_knee_ST3025_case, axis along x through y 4, z 123): its medial face is the plane x 33.15 (case y -6..14, top z 153). Screw sites = the case model''s threaded M2 holes that open on that face (dia 1.6, modelled thread from x 33.15 to 37.65): the two upper corner holes and the three holes on a 7 mm radius about (y 4, z 143). The motor refit''s "far group" (16 mm circle about (4, 143)) only matches dia 2.0 holes inside the case, behind its 2.35 mm medial wall (x 35.5..37.3); a screw there meets solid wall, so the cheek no longer has those four holes.'
  RF_KNEE_FACE_X:
    value: 33.15
    doc: clamping face of the cheek = the knee case's medial face
  RF_KNEE_SLIT_X1:
    value: 34.175
    doc: medial wall of the end block's knee-case pocket (x; the motor-refit thigh's value)
  RF_END_X0:
    value: 31.0
    doc: medial face of the kept end block (and of the motor-refit cheek)
  RF_CHEEK_X0:
    value: 29.0
    doc: medial face of the new cheek (4.15 mm thick; roll-stall bending); the screw heads seat
  RF_CHEEK_Y:
    value: [-6.5, 14.5]
    doc: 'in spot faces at rf_med_seat_x(), the mirror of the lateral seat (owner 2026-11-20) cheek width below the knee case top: case y -6..14 plus 0.5 mm'
  RF_CHEEK_Z0:
    value: 139.5
    doc: cheek lower edge (lowest screw hole edge z 141.8)
  RF_NUT_POCKET_H:
    value: 2.6
    doc: 'Shell posts: (x, z), tip y (the shell boss sits on it), nut y (make_captive_nut_pocket centre: the pocket spans RF_NUT_POCKET_H from 0.10 behind it towards the tip). The nut sits behind a solid wall at the tip (the pocket used to open through the tip, so under pull-off the nut left with the shell): moved RF_POST_NUT_SHIFT deeper (front, rear). The rear shift is smaller: the rear screw bore cannot go deeper than y 26.0 (the rear ear-boss key pocket floor at y 25.5 overlaps the bore''s edge in x), and a full nut plus a tip margin needs >= 3.2 mm of bore beyond the nut''s near face. The insertion slot of each pocket opens upward (+z) through the post top, into free space above the post.'
  RF_POST_NUT_SHIFT:
    value: [2.6, 1.6]
    doc: 'rear 1.60 (was 2.00): the bore beyond the nut ends RF_POST_BORE_FREE past the nut face, and'
  RF_POST_BORE_FREE:
    value: 3.2
    doc: 'its blind end then keeps 1.32 mm (was 0.5, under one line) over the rear key pocket floor bore beyond the nut''s tip-side face: a full nut (2.4) + point (0.5) + tip margin (0.3)'
  RF_POST_BORE_INTO_PLATE:
    value: 1.0
    doc: 'front posts: the screw bore runs this far into the plate (was 0.2 short of its outer face):'
  RF_PLATE_Z0:
    value: 153.4
    doc: 'H-cage (owner 2026-11-19: the 0.15 mm plate-to-arm gaps will not hold for printed parts and hand assembly; the 4 upper roll-case screws go; "an H connector with a 90 deg rotation in the middle", 2 + 2 screws on each actuator). roll case: its 2 lower ear screws per y face (z 161 front, 157.25 rear); plates cut back under the swept Stage 5 arms; knee case: 2 medial + 2 lateral screws, joined to the plates by an outboard wall on the roll case''s outboard end and a bridge over the knee case top to the lateral cheek. The two wings mirror each other about the knee case''s mid-plane (owner 2026-11-20 "why not make it symmetric the wings of the H?"): medial holes case+z.4 / .5 and lateral holes case-z.1 / .2 are all at (y -3 / 11, z 143); both cheeks seat the heads in dia RF_SPOT_D spot faces at the same stack from the case face (the lateral one, set by the shell), so all four are one screw. Every screw has a steel sleeve; the screw sites are the defined holes of connector_screws.json (rf_defined_holes), threads and lengths come from screw_plan.py. plate / rib / walls lower edge: knee case top (z 153) + 0.4, so the knee case (with the'
  RF_CASE_END_X:
    value: 68.36
    doc: shin on its output) slides in along y between the cheeks turned roll case's outboard end face
  RF_OUT_WALL_X:
    value: [68.6, 73.6]
    doc: outboard wall on that face (0.24 mm off it); reaches 0.45 mm into the lateral cheek
  RF_PLATE_TOP:
    value: 177.0
    doc: '(x 73.15 ..): a 73.0 face left a 0.15 mm slit beside the bridge (49 MPa FEM peak) top of the H-cage plates and both end walls (owner 2026-11-20: the plates reached up'
  RF_BRIDGE_Z1:
    value: 159.0
    doc: '(plate inner face, wall face, shared top) under the 3D bevel, which crashed OCC bridge over the knee case top: z RF_PLATE_Z0 .. this, outboard wall -> lateral cheek'
  RF_KNEE_LAT_FACE_X:
    value: 73.15
    doc: knee case's lateral face = clamping face of the lateral cheek
  RF_LAT_CHEEK_X1:
