    doc: '0.07 mm2 faces and 0.09-0.21 mm edges) Old thigh arm layers and horn / idler bolt circle. The Stage 5 arms now follow the defined holes and screw lengths (rf5_screws: front y -16.6 .. -11.6, rear 25.0 .. 30.4); these values stay as the arm faces the committed thigh-shell skin was fitted around (thigh_shell.py arm_hub_points / station_hull: RF_ARM_F/R with RF_ARM_THICKEN). out, clamp, in'
