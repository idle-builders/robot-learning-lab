    value: 0.42
    doc: cage to the blue thigh shell's inner wall (same link, static; lead 2026-11-20; 0.5 until
  RF_LAT_BAND:
    value: [147.5, 1.8]
    doc: '2026-11-22 left the flat knee cheeks 1.17 / 1.18 mm = 1.9 lines under the heads, 0.42 gives >= 1.24 = 2 lines of the 0.6 nozzle; knee screws M2x5 keep 3.25 of the 3.0 reference): the lateral cheek stays inside the committed shell skin (thigh_shell.SURF) minus WALL + this (no flare at the knee end: the cage gives way, not the shell) Lateral knee cheek, flat (owner 2026-11-22: "the outside has a weird sloped part, what is the reason for that?"; it was the cheek trimmed to the shell envelope, which narrows toward the knee). Now a constant XZ section along y: the outer face is the vertical plane of the head seats (rf_lat_seat_x()) up to RF_LAT_BAND[0], a straight 45 deg chamfer out by RF_LAT_BAND[1] (a band of constant section stiffening the cheek''s top, where it hangs from the bridge), vertical again, and a straight 45 deg chamfer back in to the outboard wall''s outer face (RF_OUT_WALL_X[1]) at the bridge top RF_BRIDGE_Z1 (self-supporting for print up -z; it stays under the outboard window, z 160). Every corner of the section stays inside the shell envelope (rf_lat_cheek_envelope_margin()); no lateral spot faces (the face is the seat). (z where the outward chamfer starts: above the dia 8 press-tip landing about the'
  RF_LAT_HEAD_K:
    value: 1.3
    doc: 'screws at z 143; chamfer leg / band thickness over the seat plane, mm; FEM-sized) head height of the lateral screws (ISO 7380-1-style M2 button head, assumption):'
  RF_SPOT_D:
    value: 8.0
    doc: 'the head seats in a dia RF_SPOT_D spot face so its top stays inside the envelope = the press tool''s heated tip (press_lib TIP_D): flat landing for pressing the sleeve'
