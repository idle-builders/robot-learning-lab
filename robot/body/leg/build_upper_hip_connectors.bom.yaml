      +8.6..+14.4 %. One-change solves: the both-cheek supports alone give p99 -3.7..-2.8 %, peak -7.3..-0.2 %, displacement -13.6..-12.1 %; the
      smaller idler-side load patch accounts for the rest. Not chased further. Shin STEP: roll-flip/parts/R_shin_combined.step (6f314a22, offset
