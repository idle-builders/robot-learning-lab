# Cove-50 body definition for robot/body/leg/package_complete_leg_hip.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: package-complete-leg-hip
owner: (set by the owning session)
generators:
- id: section-package-complete-leg-hip
  command:
  - .venv/bin/python
  - -B
  - robot/body/leg/package_complete_leg_hip.py
  rebuild: false
  outputs:
  - artifacts/robot/body/leg/complete_leg_hip_combined
  notes: 'Section builder: the body rebuild links its outputs read-only and does not rerun it (command recorded by the BOM migration from the
    producer table; confirm before running).'
# Joint ranges of the legs: the single source of these ranges (owner 2026-11-23). The assembler writes them into the body
# manifest, the checks sweep them and the dashboard moves the CAD over them (robot/body/bom/bom_config.py). Change a range here.
joints:
- match: [R_hip_yaw, L_hip_yaw]
  range_deg: [-30.0, 30.0]
  doc: Hip yaw, accepted range.
- match: [R_hip_pitch, L_hip_pitch]
  range_deg: [-58.0, 45.0]
  doc: Hip pitch (negative = flexion forward), accepted range.
- match: [R_hip_roll, L_hip_roll]
  range_deg: [-30.0, 25.0]
  doc: Hip roll, accepted range of the roll-flip thigh (hip-roll motor in the thigh).
- match: [R_knee, L_knee]
  range_deg: [0.0, 95.0]
  doc: Knee flexion; the A-11 realistic pose library (robot/body/hip-shell/sections/leg_motion.py) reaches 95. Confirmed with the owner
    on the hip-roll-motor-in-thigh study, 2026-11-23; the thigh shells are extended down to suit it.
- match: [R_ankle_pitch, L_ankle_pitch]
  range_deg: [-25.0, 25.0]
  doc: Ankle pitch, accepted range.
- match: [R_ankle_roll, L_ankle_roll]
  range_deg: [-20.0, 20.0]
  doc: Ankle roll, accepted range.
config:
  # robot/body/leg/package_complete_leg_hip.py module constants (moved 2026-11-24)
  STAGE_COLORS:
    value: {stage1_shin: [42, 138, 184, 255], stage2_ankle_coupler: [28, 164, 142, 255], stage3_foot_monocoque: [212, 134, 52, 255], stage4_thigh: [64, 156, 212, 255], stage5_hip_pitch_to_roll: [228, 118, 68, 255], stage6_hip_yaw_to_pitch: [46, 178, 136, 255], sleeve: [215, 222, 230, 255]}
  PRINT_ORIENTATIONS:
    value: {stage1_shin: YZ Cheek / Oblique Bed (layer normal Z/X), stage2_ankle_coupler: YZ Oblique Arch Bed (layer normal X), stage3_foot_monocoque: XY Flat Sole Bed (layer normal Z), stage4_thigh: YZ Medial Cheek Bed (layer normal X), stage5_hip_pitch_to_roll: XY Corridor Bridge Bed (layer normal Z), stage6_hip_yaw_to_pitch: YZ Lateral Wall / XY Top Deck Bed (layer normal X)}
  # robot/body/leg/common.py module constants (moved 2026-11-24)
  MATERIALS:
    value: {Al5052_H32: {name: Aluminium 5052-H32 (baseline sheet), density_g_cm3: 2.68, E_MPa: 68300.0, nu: 0.33, reference_strength_MPa: 193.0}, Al6061_T6: {name: Aluminium 6061-T6 (baseline flat plate/sole), density_g_cm3: 2.7, E_MPa: 68900.0, nu: 0.33, reference_strength_MPa: 276.0}, PAHT_CF_dry: {name: 'Bambu PAHT-CF / PA12-CF (dry, FDM)', density_g_cm3: 1.22, E_inplane_MPa: 7550.0, E_layer_MPa: 3290.0, G_MPa: 1100.0, nu: 0.35, tensile_XY_MPa: 92.0, tensile_Z_layer_MPa: 43.0}, PAHT_CF_wet: {name: 'Bambu PAHT-CF / PA12-CF (moisture-conditioned, FDM)', density_g_cm3: 1.22, E_inplane_MPa: 6570.0, E_layer_MPa: 2700.0, G_MPa: 950.0, nu: 0.35, tensile_XY_MPa: 71.0, tensile_Z_layer_MPa: 37.0}, PETG_CF: {name: PETG-CF / PLA-CF (home-lab standard CF filament), density_g_cm3: 1.25, E_inplane_MPa: 5800.0, E_layer_MPa: 2850.0, G_MPa: 1000.0, nu: 0.35, tensile_XY_MPa: 68.0, tensile_Z_layer_MPa: 34.0}, Steel_Sleeve: {name: 304 Stainless Steel compression sleeve / cross-bolt, density_g_cm3: 7.85, E_MPa: 200000.0, nu: 0.29}}
    doc: 'Material definitions used across matched FEM comparisons: - Aluminium 5052-H32 / 6061-T6 baseline sheet/plate - PAHT-CF / PA12-CF dry & conditioned (orthotropic FDM, print layer normal customizable per part) - PETG-CF / PLA-CF home-lab stiff filament sensitivity - 304 Stainless / Alloy Steel compression sleeves & cross-bolts'
