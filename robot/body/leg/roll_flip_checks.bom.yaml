# Cove-50 body definition for robot/body/leg/roll_flip_checks.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file. Both manifest generators also
# read the torso / foot / hip-yaw screws, held-parts and neck-collar records they swap in (TS/FS/HYS/HP/NC.swap_parts).
schema: cove50-body-definition/1
definition: roll-flip-checks
owner: (set by the owning session)
generators:
- id: roll-flip-manifest-bootstrap
  command:
  - .venv/bin/python
  - -B
  - robot/body/leg/roll_flip_checks.py
  - manifest
  report_files: [artifacts/robot/body/leg/roll-flip/report.json]   # merges its own section (roll_flip_checks.merge)
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - artifacts/robot/body/leg/roll-flip/cad-manifest.json
  - artifacts/robot/body/torso/torso-screws/records.json
  - artifacts/robot/body/leg/foot-screws/records.json
  - artifacts/robot/body/leg/hip-yaw-screws/records.json
  - artifacts/robot/body/assembly/held-parts/records.json
  - artifacts/robot/body/assembly/neck-collar/records.json
  outputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  - artifacts/robot/body/leg/roll-flip/parts/moved
  manifest_out: artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  notes: 'Bootstrap pass: ankle_coupler_screws.py build reads the coupler from this manifest, and this manifest swaps in the coupler that build
    writes (circular). Without records.json it keeps the unedited coupler and prints a WARNING.'
  after:
  - roll-flip-cad
  writes_into: &id001
  - artifacts/robot/body/neck-head/parts
  - artifacts/robot/body/neck-head/combined
- id: roll-flip-manifest
  command:
  - .venv/bin/python
  - -B
  - robot/body/leg/roll_flip_checks.py
  - manifest
  report_files: [artifacts/robot/body/leg/roll-flip/report.json]   # merges its own section (roll_flip_checks.merge)
  composes: roll-flip                # applies every definition's `compose` entry into roll-flip; their `needs` run first
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - artifacts/robot/body/leg/roll-flip/cad-manifest.json
  outputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  manifest_out: artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  notes: Rewrites the variant from the shell-pass manifest with the edited coupler swapped in and the hip / coupler screws generated from their
    defined holes.
  after:
  - ankle-coupler-screws
  writes_into: *id001
