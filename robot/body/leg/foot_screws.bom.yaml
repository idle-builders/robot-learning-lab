# Cove-50 body definition for robot/body/leg/foot_screws.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: foot-screws
owner: (set by the owning session)
generators:
- id: foot-screws
  command:
  - .venv/bin/python
  - -B
  - robot/body/leg/foot_screws.py
  - build
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - robot/body/fastening/connector_screws.json
  outputs:
  - artifacts/robot/body/leg/foot-screws/records.json
  - artifacts/robot/body/leg/foot-screws/parts
  notes: Edited foot monocoque + sleeves (T-rptay5) that roll_flip_checks manifest swaps in, with the two boot retention bosses (T-jh7fcm, sites
    from the shell-pass manifest's shell_pass.boot.screws); without it the manifest keeps the unedited foot and
    warns (2026-11-20 run).
  after:
  - shell-pass
parts:
- match: R_foot_monocoque_combined
  kind: printed
  notes: 'Two small bosses on the plate carry the boot halves'' retention screws (T-jh7fcm): toe tip (face y -63.25, axis z 9.7) and heel (face y 44.35, the plate''s rear edge, axis z 8), block 8.0 x 7.5 mm, dia 1.7 x 6 PA2 pilot from the face (sites from shells.py BOOT_*); foot_screws.py boot_bosses.'
  line: print:R_foot_monocoque_combined
  name: R_foot_monocoque_combined
  make_buy: make
  quantity: 1
  process:
    printer: Bambu X2D
    material: Bambu PAHT-CF
    layer_normal_axes:
    - z
    up: +z
    material_alternatives:
    - Bambu PETG-CF
    seeded: 'up from manifest print_orientation ''XY Flat Sole Bed (layer normal Z)''; chosen by bed contact, then least overhang (bed mm2, overhang>45deg
      mm2) {''+z'': (7308.3, 209.2), ''-z'': (124.0, 7358.6)}'
    seeded_keys:
    - up
  fem:
    _doc: 'Leg stage 3 foot monocoque (leg fem_evaluate stage3_foot_monocoque; not in fem_refit). Supports: the foot-roll servo case''s front
      / rear bolts; load: the sole pads at toe and heel. Link shifted: manifest frame = old r1 frame + 4 mm in x.'
