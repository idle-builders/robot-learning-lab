      a metal case or horn, so no rigid patch (the support is the foot-roll case screws, fixed). Stored h is now 3.0 (the finest level under the
      6 GB cap on the roll-flip STEP; h 2.2 peaks above 6.18 GB with CG + AMG). Recovery PAHT-CF z at h 3.0: p99 2.08 / peak 12.6 / displacement
      0.33 mm (ratio 42), reaction + wrench 0.0 %. fem_setup: supports 373.7 / 380.5 mm2, load 3719 mm2, 0 shared nodes. Earlier notes: The old
      stage-3 numbers (old pipeline mesh h 3.0, r1 frame) are history, not reproduced. Solver and patch port are exact: on the old pipeline''s
      own h 3.0 mesh (42731 nodes) this module''s legacy patches give identical patch weights (main 1258 / idler 841 / load 8114 nodes) and, through
      fem_core.solve, p99 2.145 / peak 10.57 / disp 0.1139 vs the old pipeline 2.134 / 11.59 / 0.1136 (+0.5 / -9 / +0.3 %). gmsh meshes the part
      differently in the manifest frame (41931 nodes at h 3.0, main support 1076 nodes), which moves p99 +37 % and displacement +61..+72 % at
      h 3.0: the foot is sensitive to meshing at that size. The stored setup runs at h 2.2 (85649 nodes, CG + AMG: 143 s, peak 4.7 GB; spsolve
      exceeded the 6 GB cap). h 2.2, PAHT dry, recovery, z, p99 / peak / disp: legacy_coordinates 3.061 / 18.12 / 0.196, stored 2.879 / 14.31
      / 0.186 (-6 / -21 / -5 %). Mesh-frame spread of p99 for the same legacy patches: 2.13 (old mesh h 3.0), ~2.93 (manifest frame h 3.0), 3.06
