# Cove-50 body definition for robot/body/leg/foot_screws.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: foot-screws
owner: (set by the owning session)
generators:
- id: foot-screws
  command:
  - .venv/bin/python
  - -B
  - robot/body/leg/foot_screws.py
  - build
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - robot/body/fastening/connector_screws.json
  outputs:
  - artifacts/robot/body/leg/foot-screws/records.json
  - artifacts/robot/body/leg/foot-screws/parts
  notes: Edited foot monocoque + sleeves (T-rptay5) that roll_flip_checks manifest swaps in; without it the manifest keeps the unedited foot and
    warns (2026-11-20 run).
  after:
  - shell-pass
parts:
- match: R_foot_monocoque_combined
  kind: printed
  line: print:R_foot_monocoque_combined
  name: R_foot_monocoque_combined
  make_buy: make
  quantity: 1
- match: R_foot_monocoque_combined_steel_sleeves
  kind: hardware
  line: steel-sleeve-sets
  name: Steel sleeve sets (CAD parts; the sleeves are bought by size, see contains)
  make_buy: context
  quantity: 1
  contains:
  - line: sleeve:3.8x2.2x3.9
    name: 304 steel compression sleeve 3.8 x 2.2 x 3.9 mm (outer x inner x length)
    quantity: 2
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 3.8
      inner_dia_mm: 2.2
      length_mm: 3.9
    supplier: unknown
    part_number: unknown
  - line: sleeve:3.8x2.2x4.5
    name: 304 steel compression sleeve 3.8 x 2.2 x 4.5 mm (outer x inner x length)
    quantity: 2
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 3.8
      inner_dia_mm: 2.2
      length_mm: 4.5
    supplier: unknown
    part_number: unknown
- match: L_foot_monocoque_combined
  kind: printed
  line: print:L_foot_monocoque_combined
  name: L_foot_monocoque_combined
  make_buy: make
  quantity: 1
- match: L_foot_monocoque_combined_steel_sleeves
  kind: hardware
  line: steel-sleeve-sets
  name: Steel sleeve sets (CAD parts; the sleeves are bought by size, see contains)
  make_buy: context
  quantity: 1
  contains:
  - line: sleeve:3.8x2.2x3.9
    name: 304 steel compression sleeve 3.8 x 2.2 x 3.9 mm (outer x inner x length)
    quantity: 2
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 3.8
      inner_dia_mm: 2.2
      length_mm: 3.9
    supplier: unknown
    part_number: unknown
  - line: sleeve:3.8x2.2x4.5
    name: 304 steel compression sleeve 3.8 x 2.2 x 4.5 mm (outer x inner x length)
    quantity: 2
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 3.8
      inner_dia_mm: 2.2
      length_mm: 4.5
    supplier: unknown
    part_number: unknown
assembly:
  steps:
  - id: right_leg:p043
    subassembly: right_leg
    part:
    - R_foot_monocoque_combined
    - R_foot_monocoque_combined_steel_sleeves
    direction: [0.0, 0.0, 1.0]
    after:
    - right_leg:p042
    status: seeded
    derived: 'graph order, fastened distance 55 from the base; direction: no screw to placed parts: toward the centroid of placed neighbours (R_B13_C047_foot_roll_case),
      snapped to the nearest axis'
  - id: left_leg:p043
    subassembly: left_leg
    part:
    - L_foot_monocoque_combined
    - L_foot_monocoque_combined_steel_sleeves
    direction: [-0.0, 0.0, 1.0]
    after:
    - left_leg:p042
    status: seeded
    derived: 'mirror of right_leg p41 (R_ <-> L_, x negated): graph order, fastened distance 55 from the base; direction: no screw to placed parts:
      toward the centroid of placed neighbours (R_B13_C047_foot_roll_case), snapped to the nearest axis'
