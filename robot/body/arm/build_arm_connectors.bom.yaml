# Cove-50 body definition for robot/body/arm/build_arm_connectors.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: build-arm-connectors
owner: (set by the owning session)
generators:
- id: section-build-arm-connectors
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/build_arm_connectors.py
  rebuild: false
  outputs:
  - artifacts/robot/body/arm
  notes: 'Section builder: the body rebuild links its outputs read-only and does not rerun it (command recorded by the BOM migration from the
    producer table; confirm before running).'
# Joint ranges of the arms: the single source of these ranges (owner 2026-11-23); see robot/body/bom/bom_config.py.
joints:
- match: [R_shoulder_pitch, L_shoulder_pitch]
  range_deg: [-60.0, 150.0]
  doc: Shoulder pitch, collision-free shell range (was hard-coded in assemble_complete_fdm_body.py).
- match: [R_shoulder_roll, L_shoulder_roll]
  range_deg: [-15.0, 95.0]
  doc: Shoulder roll (flipped), collision-free shell range.
- match: [R_shoulder_yaw, L_shoulder_yaw]
  range_deg: [-60.0, 60.0]
  doc: Shoulder yaw.
- match: [R_elbow, L_elbow]
  range_deg: [0.0, 95.0]
  doc: Elbow flexion.
