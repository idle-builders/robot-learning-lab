# APE0 body definition for robot/body/arm/build_arm_connectors.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: build-arm-connectors
owner: (set by the owning session)
generators:
- id: section-build-arm-connectors
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/build_arm_connectors.py
  rebuild: false
  outputs:
  - artifacts/robot/body/arm
  notes: 'Section builder: the body rebuild links its outputs read-only and does not rerun it (command recorded by the BOM migration from the
    producer table; confirm before running).'
# Joint ranges of the arms, and their origins / axes in the assembled body (the arms sit inward of the arm section study's
# frames, arm/common.py P_*): the single source (owner 2026-11-23/24); see robot/body/bom/bom_config.py.
joints:
- match: [R_shoulder_pitch, L_shoulder_pitch]
  range_deg: [-60.0, 150.0]
  doc: Shoulder pitch, collision-free shell range (was hard-coded in assemble_complete_fdm_body.py).
  origin_mm: {R_shoulder_pitch: [64.0, 9.0, 352.0], L_shoulder_pitch: [-64.0, 9.0, 352.0]}
- match: [R_shoulder_roll, L_shoulder_roll]
  range_deg: [-15.0, 95.0]
  doc: Shoulder roll (flipped), collision-free shell range.
  origin_mm: {R_shoulder_roll: [106.0, 5.05, 360.0], L_shoulder_roll: [-106.0, 5.05, 360.0]}
- match: [R_shoulder_yaw, L_shoulder_yaw]
  range_deg: [-60.0, 60.0]
  doc: Shoulder yaw.
  origin_mm: {R_shoulder_yaw: [127.0, -10.0, 306.0], L_shoulder_yaw: [-127.0, -10.0, 306.0]}
  axis: {R_shoulder_yaw: [-0.2236068, -0.1490712, 0.96308682], L_shoulder_yaw: [-0.2236068, 0.1490712, -0.96308682]}
- match: [R_elbow, L_elbow]
  range_deg: [0.0, 95.0]
  doc: Elbow flexion.
  origin_mm: {R_elbow: [138.0, -3.0, 252.0], L_elbow: [-138.0, -3.0, 252.0]}
config:
  # robot/body/arm/common.py module constants (moved 2026-11-24)
  STAGE_LINKS:
    value: {stage1_shoulder_pitch_to_roll: shoulder_pitch_link, stage2_shoulder_roll_to_yaw: shoulder_roll_link, stage3_upper_arm_yaw_to_elbow: upper_arm, stage4_forearm_elbow_to_wrist: forearm}
  STAGE_PART_BASENAMES:
    value: {stage1_shoulder_pitch_to_roll: shoulder_pitch_to_roll, stage2_shoulder_roll_to_yaw: shoulder_roll_to_yaw, stage3_upper_arm_yaw_to_elbow: upper_arm_yaw_to_elbow, stage4_forearm_elbow_to_wrist: forearm_elbow_to_wrist}
  MATERIALS:
    value: {Al5052_H32: Aluminium 5052-H32, Steel_Sleeve: Steel 304 sleeve}
    doc: Material of each FEM / mass key of this section's scripts that is not a printed part, as its entry in robot/body/checks/data/materials.json (values there). Printed parts take their declared material (bom_config.material / mass_kg; PRINTED_MATERIAL for study-family parts no definition claims); the 1.22 g/cm3 PAHT-CF dry / wet and PETG-CF keys were removed 2026-11-25 (no datasheet entry, wet has none at all).
  PRINTED_MATERIAL:
    value: Bambu PAHT-CF
    doc: Material of the printed parts this section's scripts write that no definition entry claims (truss_box / topopt study families); a
      claimed part takes its entry's process.material. Density and FEM constants from robot/body/checks/data/materials.json.
    decision: legacy-materials 2026-11-25 (was legacy_fdm_PAHT_CF_dry, 1.22 g/cm3)
  ALT_PRINTED_MATERIAL:
    value: Bambu PETG-CF
    doc: The alternative print material the study builders also report a polymer mass for (was legacy_fdm_PETG_CF).
  ARM_LOAD_WRENCHES:
    value: {stage1_shoulder_pitch_to_roll: {manip_1p5kg_reach: [4.5, -6.0, -20.5, 980.0, 1450.0, 340.0], support_4kg_1g: [8.0, -12.0, 39.23, 1480.0, 2150.0, 460.0], recovery_4kg_1p5g: [16.0, -20.0, 58.84, 2180.0, 3150.0, 680.0], heavy_6kg_1g: [20.0, -24.0, 58.84, 2450.0, 3480.0, 780.0]}, stage2_shoulder_roll_to_yaw: {manip_1p5kg_reach: [4.0, -5.5, -18.5, 860.0, 1240.0, 310.0], support_4kg_1g: [7.5, -11.0, 39.23, 1320.0, 1890.0, 420.0], recovery_4kg_1p5g: [14.0, -18.0, 58.84, 1920.0, 2760.0, 620.0], heavy_6kg_1g: [18.0, -22.0, 58.84, 2180.0, 3090.0, 710.0]}, stage3_upper_arm_yaw_to_elbow: {manip_1p5kg_reach: [3.5, -5.0, -16.5, 740.0, 980.0, 260.0], support_4kg_1g: [7.0, -10.0, 39.23, 1180.0, 1560.0, 360.0], recovery_4kg_1p5g: [13.0, -16.0, 58.84, 1740.0, 2280.0, 540.0], heavy_6kg_1g: [16.0, -20.0, 58.84, 1980.0, 2580.0, 620.0]}, stage4_forearm_elbow_to_wrist: {manip_1p5kg_reach: [3.0, -4.5, -14.5, 580.0, 780.0, 190.0], support_4kg_1g: [6.0, -9.0, 39.23, 960.0, 1280.0, 290.0], recovery_4kg_1p5g: [11.0, -14.0, 58.84, 1420.0, 1880.0, 430.0], heavy_6kg_1g: [14.0, -18.0, 58.84, 1620.0, 2140.0, 510.0]}}
    doc: Study load cases (N, N mm at the stage load patch); run_arm_topopt.py loads its topology optimisation with them.
  # robot/body/arm/package_and_render.py module constants (moved 2026-11-24)
  STAGE_COLORS:
    value: {stage1_shoulder_pitch_to_roll: [42, 138, 184, 255], stage2_shoulder_roll_to_yaw: [28, 164, 142, 255], stage3_upper_arm_yaw_to_elbow: [212, 134, 52, 255], stage4_forearm_elbow_to_wrist: [64, 156, 212, 255], sleeve: [215, 222, 230, 255], nut: [220, 185, 75, 255], screw: [210, 218, 226, 255], hard_cover: [231, 222, 201, 255]}
