# Cove-50 body definition for robot/body/arm/build_arm_connectors.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: build-arm-connectors
owner: (set by the owning session)
generators:
- id: section-build-arm-connectors
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/build_arm_connectors.py
  rebuild: false
  outputs:
  - artifacts/robot/body/arm
  notes: 'Section builder: the body rebuild links its outputs read-only and does not rerun it (command recorded by the BOM migration from the
    producer table; confirm before running).'
# Joint ranges of the arms: the single source of these ranges (owner 2026-11-23); see robot/body/bom/bom_config.py.
joints:
- match: [R_shoulder_pitch, L_shoulder_pitch]
  range_deg: [-60.0, 150.0]
  doc: Shoulder pitch, collision-free shell range (was hard-coded in assemble_complete_fdm_body.py).
- match: [R_shoulder_roll, L_shoulder_roll]
  range_deg: [-15.0, 95.0]
  doc: Shoulder roll (flipped), collision-free shell range.
- match: [R_shoulder_yaw, L_shoulder_yaw]
  range_deg: [-60.0, 60.0]
  doc: Shoulder yaw.
- match: [R_elbow, L_elbow]
  range_deg: [0.0, 95.0]
  doc: Elbow flexion.
config:
  # robot/body/arm/common.py module constants (moved 2026-11-24)
  STAGE_LINKS:
    value: {stage1_shoulder_pitch_to_roll: shoulder_pitch_link, stage2_shoulder_roll_to_yaw: shoulder_roll_link, stage3_upper_arm_yaw_to_elbow: upper_arm, stage4_forearm_elbow_to_wrist: forearm}
  STAGE_PART_BASENAMES:
    value: {stage1_shoulder_pitch_to_roll: shoulder_pitch_to_roll, stage2_shoulder_roll_to_yaw: shoulder_roll_to_yaw, stage3_upper_arm_yaw_to_elbow: upper_arm_yaw_to_elbow, stage4_forearm_elbow_to_wrist: forearm_elbow_to_wrist}
  REPLACED_ARM_PARTS:
    value: [L_S_yaw_to_elbow, L_fore_carrier, L_fore_frame_M3x10_-7, L_fore_frame_M3x10_7, L_fore_frame_nut_-7, L_fore_frame_nut_7, L_forearm_frame_drilled, L_shoulder_PA2x10_1, L_shoulder_PA2x10_2, L_shoulder_PA2x10_3, L_shoulder_PA2x10_4, L_shoulder_back_M3x6_353, L_shoulder_back_M3x8_339, L_shoulder_carrier, L_shoulder_front_M3x6_351, L_shoulder_front_M3x8_339, R_S_yaw_to_elbow, R_fore_carrier, R_fore_frame_M3x10_-7, R_fore_frame_M3x10_7, R_fore_frame_nut_-7, R_fore_frame_nut_7, R_forearm_frame_drilled, R_shoulder_PA2x10_1, R_shoulder_PA2x10_2, R_shoulder_PA2x10_3, R_shoulder_PA2x10_4, R_shoulder_back_M3x6_353, R_shoulder_back_M3x8_339, R_shoulder_carrier, R_shoulder_front_M3x6_351, R_shoulder_front_M3x8_339, upper__L_forearm_tube_1, upper__L_forearm_wrist_one_piece, upper__L_pitch_to_roll_one_piece, upper__L_pitch_to_roll_plate_1, upper__L_roll_to_yaw_one_piece, upper__L_roll_to_yaw_plate_1, upper__L_yaw_case_PA2x7_1, upper__L_yaw_case_PA2x7_2, upper__L_yaw_to_elbow_one_piece, upper__R_forearm_tube_1, upper__R_forearm_wrist_one_piece, upper__R_pitch_to_roll_one_piece, upper__R_pitch_to_roll_plate_1, upper__R_roll_to_yaw_one_piece, upper__R_roll_to_yaw_plate_1, upper__R_yaw_case_PA2x7_3, upper__R_yaw_case_PA2x7_4, upper__R_yaw_to_elbow_one_piece]
    doc: Complete set of legacy sheet-metal frames, plates, tubes, carriers, and carrier screws replaced by the 4-stage FDM arm connectors
