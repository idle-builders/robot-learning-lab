defects:
- id: step-dropped-by-morph
  kind: no_scripted_step
  parts:
  - '*_upper_arm_hard_cover'
  - '*_shin_back_hard_cover'
  - combined__stage2_lower_pelvis_battery_cradle
  state: 'An upstream STEP exists (artifacts/robot/body/assembly/parts), but robot/body/ape-proportions/build.py stretches the mesh and records
    the STEP as native_step_unmorphed, so the selected body has no STEP. The cradle is a structural carrier: its checks run on the mesh.'
  fix: 'Same as above: stretch the B-rep in build.py (BRepBuilderAPI_GTransform for the axial scale; a piecewise stretch needs a split, scale,
    fuse) and write native_step (medium). Do the cradle first: it carries load.'
  effort: medium
