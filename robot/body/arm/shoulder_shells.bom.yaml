              hand_parts:
              - R_palm_*
              - R_left_finger
              - R_right_finger
              stage_link: R_shoulder_roll_link
              step_deg: 15.0
              directions: 96
          recovery_4kg_1p5g:
            hand_envelope:
              force_N: 58.84
              hand_parts:
              - R_palm_*
              - R_left_finger
              - R_right_finger
              stage_link: R_shoulder_roll_link
              step_deg: 15.0
              directions: 96
      cone_45:
        load_cases:
          manip_1p5kg_reach:
            hand_envelope:
              force_N: 14.71
              hand_parts:
              - R_palm_*
              - R_left_finger
              - R_right_finger
              stage_link: R_shoulder_roll_link
              step_deg: 15.0
              directions: 96
              cone_deg: 45.0
          support_4kg_1g:
            hand_envelope:
              force_N: 39.23
              hand_parts:
              - R_palm_*
              - R_left_finger
              - R_right_finger
              stage_link: R_shoulder_roll_link
              step_deg: 15.0
              directions: 96
              cone_deg: 45.0
          recovery_4kg_1p5g:
            hand_envelope:
              force_N: 58.84
              hand_parts:
              - R_palm_*
              - R_left_finger
              - R_right_finger
              stage_link: R_shoulder_roll_link
              step_deg: 15.0
              directions: 96
              cone_deg: 45.0
      shoulder_u:
        _doc: 'Stage 2 as the simplified green U (owner decisions 2026-11-20; candidate artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json):
          supports = the 4 M2 far-hole sleeves at the roll case (sleeves along y, same spec as the main setup), load = today''s 4 yaw-case sleeves,
          rigid. Load cases = the arm load envelope of the main setup. Run with --manifest <candidate> --fem-variant shoulder_u. Supports: the
          main setup''s roll-case sleeve patch with gap 3.0 mm: at the case-y far holes the case face is the strip 2.2 mm below the raised panel
          the -y arm rests on, so gap 2.0 caught only the +y pair (review 2026-11-22).'
        materials:
        - Bambu PAHT-CF
        - Bambu PETG-CF
        mesh_h_mm: 1.2
        convergence:
          manifest: 'artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json (stiffened green: 7.0 / 6.0 mm arms, plate to the
            end-face plane, root fillets)'
          levels:
          - h_from: '1.2'
            h_to: '0.9'
            nodes: 11939 -> 19071
            p99_change_pct: +2.6..+3.1 (envelope p50 / p90 / max, all cases, PAHT-CF / PETG-CF)
            p99_layer_tension_change_pct: -0.2..+0.4 (max)
            max_displacement_change_pct: +6.3..+6.5 (max)
          stored_h_rule: first level whose p99 change to the next finer level is < 5 %
          stored_h_result: '1.2'
          converged: true
          finer_level_not_run: 'h 0.7: the 1.2 -> 0.9 p99 change is under 5 %'
          at_h_0p9: 'recovery over 8310 wrenches: PAHT-CF p99 max 35.8 MPa, strength ratio min 2.46 (median 7.87), layer ratio min 3.38, displacement
            max 1.42 mm; PETG-CF ratio min 1.64 (median 5.26), layer 2.02, displacement 2.25 mm; 0 wrenches below 1'
        supports:
          roll_case:
            holes:
              of: R_shoulder_roll_to_yaw_combined_steel_sleeves
              mate:
              - upper__R_roll_C047_case
              gap_mm: 3.0
              r_max_mm: 5.0
              rim_mm: 2.0
              axis_within_deg:
                axis:
                - 0
                - 1
                - 0
                deg: 20
    load_cases_doc: 'Load cases (owner decision 2026-11-20): each case is a hand-tip force of the case magnitude (1.5 kg x 1 g, 4 kg x 1 g, 4
      kg x 1.5 g; the old heavy_6kg_1g had the same 58.84 N as recovery and is the recovery envelope) within a +-30 deg push cone around the hand-to-shoulder
      line, over every arm pose (15 deg grid over the manifest ranges), capped where a servo of the chain would pass its stall (motor map), moved
      to the load centroid in the stage''s frame (checks/arm_loads.py). The fem check evaluates every wrench on the unit-wrench basis and reports
      the distribution and the worst pose / direction. Variants: any_direction and cone_45 = stress context (not requirements); short_arm_wrenches
      = the old hand-typed ARM_LOAD_WRENCHES (short arm, history).'
