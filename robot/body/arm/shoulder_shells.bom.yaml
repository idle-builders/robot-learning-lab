# Cove-50 body definition for robot/body/arm/shoulder_shells.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: shoulder-shells
owner: (set by the owning session)
generators:
- id: shoulder-shells
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/shoulder_shells.py
  - apply
  inputs:
  - artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json
  - artifacts/robot/body/arm/shoulder-clevis/cad-manifest.json
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  outputs:
  - artifacts/robot/body/arm/shoulder-clevis/shells/assembly-parts-shoulder-u-shells.json
  - artifacts/robot/body/arm/shoulder-clevis/shells/parts
  - artifacts/robot/body/arm/shoulder-clevis/shells/report.json
  manifest_out: artifacts/robot/body/arm/shoulder-clevis/shells/assembly-parts-shoulder-u-shells.json
  resources:
    timeout_s: 1800
  notes: Parametric upper-arm covers on the green U and round torso openings about the shoulder pitch axes (Idle T-tph7xb; selected by the owner
    2026-11-22, commit 7fd81122f / 458b6ef6d). Writes the selected body. Added to the chain by the BOM session (T-ghvncz) from the script docstring;
    not yet rerun in the isolated copy.
  after:
  - shoulder-clevis-manifest
parts:
- match: center_front_shell
  kind: printed
  line: print:center_front_shell
  name: center_front_shell
  make_buy: make
  quantity: 1
  section: Torso
- match: center_back_shell
  kind: printed
  line: print:center_back_shell
  name: center_back_shell
  make_buy: make
  quantity: 1
  section: Torso
- match: R_shoulder_roll_to_yaw_combined
  kind: printed
  line: print:R_shoulder_roll_to_yaw_combined
  name: R_shoulder_roll_to_yaw_combined
  make_buy: make
  quantity: 1
  process:
    printer: Bambu X2D
    material: Bambu PAHT-CF
    layer_normal_axes:
    - z
    up:
    - -0.164399
    - 0.0
    - 0.986394
    material_alternatives:
    - Bambu PETG-CF
    up_source: 'designed (robot/body/arm/shoulder_clevis.py): the green U is printed on its plate bottom (yaw-saddle plane), up = the yaw-local
      normal, 9.5 deg off +z; layer_normal_axes z = the nearest axis, used by the FEM because up is not along an axis'
  loadpath_slices:
    axis: z
    range_mm:
    - 330.0
    - 355.0
    n_slices: 12
  fem:
    _doc: 'Arm stage 2 (R_shoulder_roll_to_yaw). Supports: the sleeve sites at the roll C047 motor case (today''s body: the old ''roll main horn''
      interface is the roll case here); load: the sleeve sites at the yaw C047 motor case. Load cases: the arm load envelope (load_cases_doc);
      the old ARM_LOAD_WRENCHES are the variant short_arm_wrenches. Sleeve sites come from the sleeve companion part''s bores, so they follow
      the part. Regions: 304 steel collars 0.7 mm around every sleeve bore (0.25 mm beyond the ends); no metal seat regions (the parts carry no
      metal inserts except the sleeves; the polymer under the Al servo cases is polymer). Sleeves are told apart by their axis (roll-case sleeves
      point along y, yaw-case sleeves along the yaw axis): one yaw-case sleeve sits 0.5 mm from the roll case and would otherwise be clamped and
      loaded. The load patch is rigid (all its nodes follow one rigid-body motion, the wrench acts on it at the load centroid): the sleeve rings
      cannot bend independently.'
    mesh_h_mm: 1.2
    origin_mm: load_centroid
    materials:
    - Bambu PAHT-CF
    - Bambu PETG-CF
    - legacy_fdm_PAHT_CF_dry
    regions:
    - material: Steel 304 sleeve
      where:
        bore_collars:
          of: R_shoulder_roll_to_yaw_combined_steel_sleeves
          r_extra_mm: 0.7
          end_extra_mm: 0.25
    supports:
      roll_case:
        holes:
          of: R_shoulder_roll_to_yaw_combined_steel_sleeves
          mate:
          - upper__R_roll_C047_case
          gap_mm: 2.0
          r_max_mm: 5.0
          rim_mm: 2.0
          axis_within_deg:
            axis:
            - 0
            - 1
            - 0
            deg: 20
    load:
      holes:
        of: R_shoulder_roll_to_yaw_combined_steel_sleeves
        mate:
        - upper__R_yaw_C047_case
        gap_mm: 2.0
        r_max_mm: 5.0
        rim_mm: 2.0
        axis_within_deg:
          axis:
          - -0.1644
          - 0
          - 0.9864
          deg: 20
      rigid: true
    load_cases:
      manip_1p5kg_reach:
        hand_envelope:
          force_N: 14.71
          hand_parts:
          - R_palm_*
          - R_left_finger
          - R_right_finger
          stage_link: R_shoulder_roll_link
          step_deg: 15.0
          directions: 96
          cone_deg: 30.0
      support_4kg_1g:
        hand_envelope:
          force_N: 39.23
          hand_parts:
          - R_palm_*
          - R_left_finger
          - R_right_finger
          stage_link: R_shoulder_roll_link
          step_deg: 15.0
          directions: 96
          cone_deg: 30.0
      recovery_4kg_1p5g:
        hand_envelope:
          force_N: 58.84
          hand_parts:
          - R_palm_*
          - R_left_finger
          - R_right_finger
          stage_link: R_shoulder_roll_link
          step_deg: 15.0
          directions: 96
          cone_deg: 30.0
    open_difference: 'Old arm numbers are history (owner 2026-11-18; the old arm fem_evaluate report is not in the tree, its sites were 12-48
      mm off today''s parts), not reproduced; proven by fem_setup (patches on the sleeve sites, per-side / per-mate areas, 0 shared support/load
      nodes) and mesh convergence on the roll-flip manifest (sha256 068f6436...). Load patch rigid (decision M-chnfz7: master-slave elimination
      with a 6-DOF reference node at the load centroid, direct solve; the support is fixed = already rigid). Mesh convergence, change to the next
      finer level (all cases, materials): 1.2: p99 +3.1..+4.3 % and displacement +5.4..+6.2 % to h 0.9 (2.2->1.6 +4.2..+7.1, 1.6->1.2 +5.2..+7.2).
      At the stored h: recovery p99 133 MPa (ratio 0.66), peak 732, displacement 14.0 mm (20016 nodes). At the converged level the part is overloaded
      for the 4 kg cases (p99 above the strength reference; displacement 14 mm). Differences to the old script: wrench at the load patch centroid;
      patches follow the sleeve bores next to the named mating parts; steel collars 0.7 mm around the sleeve bores; no metal seat regions (M-vnzq43);
      default material Bambu datasheet. Support is the roll case (old: roll main horn); roll-case and yaw-case sleeves are told apart by axis
      (a yaw-case sleeve sits 0.5 mm from the roll case).'
    convergence:
      manifest: artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json sha256 068f643641fe3695
      levels:
      - h_from: '2.2'
        h_to: '1.6'
        p99_change_pct: +4.2..+7.1
        peak_change_pct: +7.2..+59.7
        max_displacement_change_pct: +6.3..+7.6
      - h_from: '1.6'
        h_to: '1.2'
        p99_change_pct: +5.2..+7.2
        peak_change_pct: -16.1..+22.4
        max_displacement_change_pct: +9.6..+12.3
      - h_from: '1.2'
        h_to: '0.9'
        p99_change_pct: +3.1..+4.3
        peak_change_pct: 0.0..+23.3
        max_displacement_change_pct: +5.4..+6.2
      stored_h_rule: first level whose p99 change to the next finer level is < 5 % (all load cases x materials); the peak is one element and is
        not part of the rule
      stored_h_result: '1.2: p99 +3.1..+4.3 % and displacement +5.4..+6.2 % to h 0.9 (2.2->1.6 +4.2..+7.1, 1.6->1.2 +5.2..+7.2)'
      converged: true
    variants:
      short_arm_wrenches:
        load_cases:
          manip_1p5kg_reach:
            wrench_N_Nmm:
            - 4.0
            - -5.5
            - -18.5
            - 860.0
            - 1240.0
            - 310.0
          support_4kg_1g:
            wrench_N_Nmm:
            - 7.5
            - -11.0
            - 39.23
            - 1320.0
            - 1890.0
            - 420.0
          recovery_4kg_1p5g:
            wrench_N_Nmm:
            - 14.0
            - -18.0
            - 58.84
            - 1920.0
            - 2760.0
            - 620.0
          heavy_6kg_1g:
            wrench_N_Nmm:
            - 18.0
            - -22.0
            - 58.84
            - 2180.0
            - 3090.0
            - 710.0
      any_direction:
        load_cases:
          manip_1p5kg_reach:
            hand_envelope:
              force_N: 14.71
              hand_parts:
              - R_palm_*
              - R_left_finger
              - R_right_finger
              stage_link: R_shoulder_roll_link
              step_deg: 15.0
              directions: 96
          support_4kg_1g:
            hand_envelope:
