      the R part), up = -x (outward, along the pitch axis). Six axis directions compared with run.py --process up=... (overhang, bed, holes, walls;
      .cache/work/cad-speed/checks/shoulder-u-s1-up*): -x is the only one with a flat bed face AND every bridge under the 40 mm limit (bed 478
      mm2 one island, centre of mass 10.7 mm high; beyond-70-deg area 728 mm2, mostly the bar underside 3.4 mm above the bed (short support),
      widest bridge 35.1 mm; support on mating faces 59 mm2; the 4 pitch sleeves stand vertical). Seeded -y: 611 mm2, 55.6 mm bridge over the
