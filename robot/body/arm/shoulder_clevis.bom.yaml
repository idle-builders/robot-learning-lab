    _doc: 'Mirror of the R setup (the body mirrors x -> -x): R_ names -> L_, wrench components mirrored (Fx -> -Fx, My -> -My, Mz -> -Mz), clamp
      axes mirrored, mesh size and materials as R. Checked by fem_setup on the left part; the R setup''s own _doc follows. Arm stage 1 (R_shoulder_pitch_to_roll).
      Supports: the 4 pressed-in sleeve sites at the shoulder-pitch horn (the pitch C047 main horn; the rear idler has no sleeve site on this
