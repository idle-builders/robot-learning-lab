              cone_deg: 45.0
          support_4kg_1g:
            hand_envelope:
              force_N: 39.23
              hand_parts:
              - L_palm_*
              - L_left_finger
              - L_right_finger
              stage_link: L_shoulder_pitch_link
              step_deg: 15.0
              directions: 96
              cone_deg: 45.0
          recovery_4kg_1p5g:
            hand_envelope:
              force_N: 58.84
              hand_parts:
              - L_palm_*
              - L_left_finger
              - L_right_finger
              stage_link: L_shoulder_pitch_link
              step_deg: 15.0
              directions: 96
              cone_deg: 45.0
      shoulder_u:
        _doc: 'Stage 1 as the owner''s blue U (owner decisions 2026-11-20; candidate artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json,
          built by robot/body/arm/shoulder_clevis.py): supports = the 4 sleeve sites at the pitch main horn (unchanged interface); load = the
          sleeve sites at the roll main horn AND at the new roll rear idler, one rigid load body, the idler''s sites with a free rotation about
          the roll axis (free_rotation_about_joint): the STS3250 idler is a bearing that carries forces and off-axis moments but no roll torque,
          so the roll torque goes through the horn arm. Variant shoulder_u_horn_only (idler carries nothing) is the harsh bound. Load cases =
          the arm load envelope of the main setup. Run with --manifest <candidate> --fem-variant shoulder_u.'
        load:
        - holes:
            of: L_shoulder_pitch_to_roll_combined_steel_sleeves
            mate:
            - upper__L_roll_C047_main_horn
            gap_mm: 2.0
            r_max_mm: 5.0
            rim_mm: 2.0
          rigid: true
        - holes:
            of: L_shoulder_pitch_to_roll_combined_steel_sleeves
            mate:
            - upper__L_roll_C047_rear_idler
            gap_mm: 2.0
            r_max_mm: 5.0
            rim_mm: 2.0
          rigid: true
          free_rotation_about_joint: L_shoulder_roll
        materials:
        - Bambu PAHT-CF
        - Bambu PETG-CF
        mesh_h_mm: 0.9
        convergence:
          manifest: artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json (pitch hub r 13.5 build)
          levels:
          - h_from: '0.9'
            h_to: '0.7'
            nodes: 17649 -> 32677
            p99_change_pct: +2.9..+3.3 (recovery envelope max / p50 / p90, PAHT-CF, layer normal x)
            p99_layer_tension_change_pct: +1.5 (max)
            max_displacement_change_pct: +5.4 (max)
          earlier_geometry: 'the kept pitch interface (before the r 13.5 hub): 1.2 -> 0.9 p99 +6.1..+7.7 %, 0.9 -> 0.7 +3.0..+3.1 %'
          stored_h_rule: first level whose p99 change to the next finer level is < 5 %
          stored_h_result: '0.9'
          converged: true
          at_h_0p7: 'recovery PAHT-CF over 8310 wrenches: p99 max 22.1 MPa, strength ratio min 3.98, layer ratio min 5.77, displacement max 0.72
            mm, 0 wrenches below 1'
      shoulder_u_convergence:
        _doc: 'Mesh-convergence variant of shoulder_u: the deciding case only (recovery_4kg_1p5g envelope, Bambu PAHT-CF), for runs at finer --fem-mesh-h.'
        load:
        - holes:
            of: L_shoulder_pitch_to_roll_combined_steel_sleeves
            mate:
            - upper__L_roll_C047_main_horn
            gap_mm: 2.0
            r_max_mm: 5.0
            rim_mm: 2.0
          rigid: true
        - holes:
            of: L_shoulder_pitch_to_roll_combined_steel_sleeves
            mate:
            - upper__L_roll_C047_rear_idler
            gap_mm: 2.0
            r_max_mm: 5.0
            rim_mm: 2.0
          rigid: true
          free_rotation_about_joint: L_shoulder_roll
        materials:
        - Bambu PAHT-CF
        load_cases:
          recovery_4kg_1p5g:
            hand_envelope:
              force_N: 58.84
              hand_parts:
              - L_palm_*
              - L_left_finger
              - L_right_finger
              stage_link: L_shoulder_pitch_link
              step_deg: 15.0
              directions: 96
              cone_deg: 30.0
      shoulder_u_horn_only:
        _doc: 'Harsh bound of shoulder_u: only the roll horn''s sleeve sites carry the wrench (the idler carries nothing, not even forces). shoulder_u
          models the idler as a bearing (free about the roll axis). Run with --fem-variant shoulder_u_horn_only.'
        load:
        - holes:
            of: L_shoulder_pitch_to_roll_combined_steel_sleeves
            mate:
            - upper__L_roll_C047_main_horn
            gap_mm: 2.0
            r_max_mm: 5.0
            rim_mm: 2.0
          rigid: true
        materials:
        - Bambu PAHT-CF
        - Bambu PETG-CF
        mesh_h_mm: 0.9
    load_cases_doc: 'Load cases (owner decision 2026-11-20): each case is a hand-tip force of the case magnitude (1.5 kg x 1 g, 4 kg x 1 g, 4
      kg x 1.5 g; the old heavy_6kg_1g had the same 58.84 N as recovery and is the recovery envelope) within a +-30 deg push cone around the hand-to-shoulder
      line, over every arm pose (15 deg grid over the manifest ranges), capped where a servo of the chain would pass its stall (motor map), moved
      to the load centroid in the stage''s frame (checks/arm_loads.py). The fem check evaluates every wrench on the unit-wrench basis and reports
      the distribution and the worst pose / direction. Variants: any_direction and cone_45 = stress context (not requirements); short_arm_wrenches
      = the old hand-typed ARM_LOAD_WRENCHES (short arm, history).'
