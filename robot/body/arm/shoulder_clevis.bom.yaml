# Cove-50 body definition for robot/body/arm/shoulder_clevis.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: shoulder-clevis
owner: (set by the owning session)
generators:
- id: shoulder-clevis-cad
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/shoulder_clevis.py
  - build
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  - artifacts/robot/actuators/interfaces/sources/feetech_sts3250.step
  - artifacts/cove50-strength/complete-fdm-body-20261106/parts
  - robot/body/checks/data/part_settings.json
  - robot/body/checks/data/materials.json
  outputs:
  - artifacts/robot/body/arm/shoulder-clevis/cad-manifest.json
  - artifacts/robot/body/arm/shoulder-clevis/parts
  resources:
    timeout_s: 1800
  notes: Shoulder U connectors and the STS3250 roll idler (B-rep), placed against the roll-flip body. Selected for Shoulder at f5dc4f036 (study
    shoulder-roll-u-connectors).
  after:
  - shin-cover
- id: shoulder-clevis-manifest
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/shoulder_clevis.py
  - manifest
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  - artifacts/robot/body/arm/shoulder-clevis/cad-manifest.json
  outputs:
  - artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json
  - artifacts/robot/body/arm/shoulder-clevis/standing-overlaps.json
  manifest_out: artifacts/robot/body/arm/shoulder-clevis/assembly-parts-shoulder-u.json
  resources:
    timeout_s: 1800
  notes: 'Applies the shoulder U connectors to the roll-flip body: per side a roll idler, generated M3x8 x4, M3x6 x4, M2x12 x4; removes the roll
    case''s 4 PA2 and the two upper-arm cover posts with their M3 screws and nuts. body_manifest_chain in robot/design.json.'
  after:
  - shoulder-clevis-cad
