# APE0 body definition for robot/body/arm/arm_shell.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The arm shell: the whole arm's covers as one parametric surface (superellipse sections on natural cubic splines along the
# arm, route D's hood about the shoulder roll axis), cut at the shoulder-yaw seam and the elbow into four covers per arm.
# Owner-approved 2026-11-24 (candidate arm-shell-3, decision M-eb6cxz, Idle T-tph7xb). The eight covers, their sleeve sets
# and the four elbow-case screws (now PA2x10: the lower cover's tab is in their stack) are claimed here; the claims moved
# from shoulder_shells.bom.yaml (upper-arm hard covers) and ape-proportions/build.bom.yaml (lower covers, forearm covers,
# elbow-case PA2x7) on 2026-11-24, with their assembly steps; the forearm-cover M3x8 screws stay claimed in
# ape-proportions/build.bom.yaml, but their steps (both clamp the covers) moved here, after the covers.
schema: cove50-body-definition/1
definition: arm-shell
owner: arm shell session (Idle T-tph7xb)
generators:
- id: arm-shell
  command:
  - .venv/bin/python
  - -B
  - robot/body/arm/arm_shell.py
  - apply
  inputs:
  - artifacts/robot/body/arm/shoulder-clevis/shells/assembly-parts-shoulder-u-shells.json
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts-roll-flip.json
  - robot/body/checks/data/materials.json
  outputs:
  - artifacts/robot/body/arm/arm-shell/assembly-parts-arm-shell.json
  - artifacts/robot/body/arm/arm-shell/parts
  - artifacts/robot/body/arm/arm-shell/report.json
  manifest_out: artifacts/robot/body/arm/arm-shell/assembly-parts-arm-shell.json
  resources:
    limit_gb: 6
    timeout_s: 1800
  notes: Writes the body manifest (`body.manifest` in robot/body/complete_body.bom.yaml) from the shoulder-shells body; only the eight cover rows, the four
    elbow-case screws and six sleeve-set rows change. Shape parameters (STATIONS, CAP, SEAM, ELB, FORE_SPLIT, WALL, RUN_CLEAR) are code
    constants fitted by `arm_shell.py fit` (not part of the rebuild); joint ranges from the definitions (bom_config).
  after:
  - shoulder-shells
