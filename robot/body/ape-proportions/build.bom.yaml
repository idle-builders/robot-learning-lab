      mm off today''s parts), not reproduced; proven by fem_setup (patches on the sleeve sites, per-side / per-mate areas, 0 shared support/load
      nodes) and mesh convergence on the roll-flip manifest (sha256 068f6436...). Load patch rigid (decision M-chnfz7: master-slave elimination
      with a 6-DOF reference node at the load centroid, direct solve; the support is fixed = already rigid). Mesh convergence, change to the next
      finer level (all cases, materials): 0.7: p99 +1.3..+3.3 % and displacement +2.7..+4.0 % from h 0.9 (earlier steps +5.6, +5.5, +7.6 %); h
      0.7 is the finest run, the next level is not tested. At the stored h: recovery p99 4.5 MPa (ratio 19), peak 35, displacement 0.097 mm (35415
      nodes). p99 is far below the strength reference (ratio 13-25) in all cases. Differences to the old script: wrench at the load patch centroid;
      patches follow the sleeve bores next to the named mating parts; steel collars 0.7 mm around the sleeve bores; no metal seat regions (M-vnzq43);
      default material Bambu datasheet. Ape-proportions arm, elbow flipped: load = the 6 sleeves at the elbow case (old: elbow horn, x 163.6).
      STEP 54ee206f (earlier proof ran on 9a70a820).'
