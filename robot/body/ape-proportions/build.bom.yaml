# Cove-50 body definition for robot/body/ape-proportions/build.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: ape-proportions-build
owner: (set by the owning session)
generators:
- id: ape-proportions
  command:
  - .venv/bin/python
  - -B
  - robot/body/ape-proportions/build.py
  inputs:
  - artifacts/robot/body/motor-refit/assembly-parts.json
  - artifacts/robot/body/leg/complete_leg_hip_combined/assembly-with-full-shell.glb
  outputs:
  - artifacts/robot/body/ape-proportions/assembly-parts.json
  - artifacts/robot/body/ape-proportions/parts
  - artifacts/robot/body/ape-proportions/report.json
  manifest_out: artifacts/robot/body/ape-proportions/assembly-parts.json
  resources:
    limit_gb: 8
    timeout_s: 900
  notes: 'Env APE_OUT / APE_UPPER / APE_FOREARM / APE_SHELL_PASS only for variants; defaults are the selected build. In Git since 2026-11-20 (Idle
    T-be4dt7; until then untracked). Code vs the selected outputs: the edits made after the selected assembly-parts.json (2026-11-15 05:07 CET)
    are the reviewer fixes of T-xdcjn9 / T-gqwdrn (elbow motor sign negated once by elbow_flip.flip_motor_sign, as the selected shell-pass manifest
    already carries; hip pitch-to-roll volume scaled by the mesh ratio, those parts are replaced by the roll-flip connectors later), and the cradle-cut
    tool size, now back at the selected 2500 faces / 150 per batch. Stall of 2026-11-20 (past 3600 s, no output after the hip sleeve gmsh line):
    hips.py''s pelvis-cradle cut built one lazy manifold3d CSG tree of 3,538 swept copies and evaluated it in a single to_mesh() call (stack dumps;
    the gmsh sleeve meshes take under 1 s). Fixed by evaluating per batch (hips.cut_cradle): build.py 264 s, peak 4.3 GB; output equal to the
    selected step-3 manifest except the cradle mesh triangulation (same surface within 2e-5 mm) and the two reviewer fixes.'
  after:
  - motor-refit
