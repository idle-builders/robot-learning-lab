        peak_change_pct: -3.9..+55.4
        max_displacement_change_pct: +0.6..+2.9
      - h_from: '1.2'
        h_to: '0.9'
        p99_change_pct: +4.6..+7.6
        peak_change_pct: +1.2..+7.5
        max_displacement_change_pct: +8.9..+10.0
      - h_from: '0.9'
        h_to: '0.7'
