# Cove-50 body definition for robot/body/ape-proportions/shells.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: ape-proportions-shells
owner: (set by the owning session)
generators:
- id: shell-pass
  command:
  - .venv/bin/python
  - -B
  - robot/body/ape-proportions/shells.py
  - artifacts/robot/body/ape-proportions/assembly-parts.json
  - artifacts/robot/body/ape-proportions/shell-pass
  inputs:
  - artifacts/robot/body/ape-proportions/assembly-parts.json
  outputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - artifacts/robot/body/ape-proportions/shell-pass/parts
  - artifacts/robot/body/ape-proportions/shell-pass/report.json
  manifest_out: artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  resources:
    limit_gb: 12
    timeout_s: 3600
  notes: 'Voxel sweep of the hip and ankle target ranges; the script''s docstring runs it under memguard --limit-gb 12 (not applied here: the
    chain runs every step at the memguard default unless a step''s limit is approved). shells.py was modified 2026-11-15 06:47, after the selected
    shell-pass manifest (06:44). 12 GB cap: at 6 GB memguard stopped build.py while gmsh meshed the hip pitch-to-roll sleeves STEP (2026-11-20);
    shells.py documents 12 GB. Approved by the owner 2026-11-20.'
  after:
  - ape-proportions
parts:
- match: R_foot_boot_shell
  kind: printed
  line: print:R_foot_boot_shell
  name: R_foot_boot_shell
  make_buy: make
  quantity: 1
  notes: Toe part of the split boot (T-6c2e93), y < BOOT_SPLIT_Y in shells.py; the heel cap is R_foot_boot_heel_shell. Held by R_foot_boot_toe_PA2x8 (T-jh7fcm).
  section: Ankle / foot
- match: L_foot_boot_shell
  kind: printed
  line: print:L_foot_boot_shell
  name: L_foot_boot_shell
  make_buy: make
  quantity: 1
  notes: Toe part of the split boot (T-6c2e93), y < BOOT_SPLIT_Y in shells.py; the heel cap is L_foot_boot_heel_shell. Held by L_foot_boot_toe_PA2x8 (T-jh7fcm).
  section: Ankle / foot
- match: R_foot_boot_heel_shell
  kind: printed
  line: print:R_foot_boot_heel_shell
  name: R_foot_boot_heel_shell
  make_buy: make
  quantity: 1
  section: Ankle / foot
  notes: 'Heel cap of the boot shell, split off at y = 15.5 mm by shells.py (T-6c2e93) so the boot can go on after the foot screws. Held by R_foot_boot_heel_PA2x8 (T-jh7fcm).'
- match: L_foot_boot_heel_shell
  kind: printed
  line: print:L_foot_boot_heel_shell
  name: L_foot_boot_heel_shell
  make_buy: make
  quantity: 1
  section: Ankle / foot
  notes: 'Heel cap of the boot shell, split off at y = 15.5 mm by shells.py (T-6c2e93) so the boot can go on after the foot screws. Held by L_foot_boot_heel_PA2x8 (T-jh7fcm).'
- match:
  - R_foot_boot_toe_M2_washer
  - R_foot_boot_heel_M2_washer
  - L_foot_boot_toe_M2_washer
  - L_foot_boot_heel_M2_washer
  kind: hardware
  line: hw:M2-washer-2.2-5-x-0.3
  name: M2 washer 2.2/5 x 0.3
  make_buy: buy
  quantity: 4
  spec:
    kind: washer
    thread: M2
    standard: ISO 7089
    inner_dia_mm: 2.2
    outer_dia_mm: 5.0
    thickness_mm: 0.3
    label: M2 washer 2.2/5 x 0.3
  supplier: unknown
  part_number: unknown
  material: 'ISO 7089 M2 washer under each boot retention screw''s head, in the dia 5.4 counterbore of the boot half, on its printed tab
    (shells.py BOOT_WASHER, T-jh7fcm)'
  notes: 'Same line as the torso''s M2 washers (robot/body/assembly/assemble_complete_fdm_body.bom.yaml). Why a washer (T-jh7fcm, measured):
    a bare dk 3.5 head on the 2.4 mm clearance hole bears on a 0.55 mm ring (5.1 mm2, under one 0.62 mm line); on the washer the tab carries
    a 2.4 .. 5.0 ring (15.1 mm2, 2.96 x, 1.3 mm wide). The joint does not need its 0.3 mm thickness to close: without it the tip still ends
    0.7 mm short of the pilot bottom at tab -0.2. Replaces the custom 304 sleeves 3.6 x 2.2 x 3.5 (owner 2026-11-22: catalogue hardware
    only). Supplier: no repo source (unknown).'
  generator: shell-pass
  section: Ankle / foot
- match:
  - R_foot_boot_toe_PA2x8
  - R_foot_boot_heel_PA2x8
  - L_foot_boot_toe_PA2x8
  - L_foot_boot_heel_PA2x8
  kind: hardware
  line: hw:PA2-x-8-ISO-7380-1
  name: PA2 x 8 ISO 7380-1
  make_buy: buy
  quantity: 4
  spec:
    kind: screw
    thread: M2
    family: PA
    length_mm: 8.0
    standard: ISO 7380-1
    head_dia_mm: 3.5
    head_height_mm: 1.3
    label: PA2 x 8 ISO 7380-1
  supplier: unknown
  part_number: PA2 x 8 ISO 7380-1
  material: 'PA2x8 self-tapping, on an ISO 7089 M2 washer through the plain dia 2.4 hole of a boot half''s tab into a dia 1.7 x 6 pilot in
    the foot monocoque''s boss (PA2 family envelope: head dia 3.5 x 1.3, shank dia 2, 0.6 mm point)'
  notes: 'Boot retention (T-jh7fcm): one per boot half along its slide direction, the toe part''s at the toe tip (+y), the heel cap''s at the
    heel (-y); same screw as the shin back cover (one BOM line). Stack (shells.py boot_stack): tab 2.9 + washer 0.3, engagement 4.3 (4.1 at
    tab +0.2, reference 4.0), tip 4.8 in a 6.0 pilot (5.3 at tab -0.2 without the washer). Supplier: no repo source (unknown).'
  generator: shell-pass
  section: Ankle / foot
assembly:
  steps:
  - id: right_leg:p060
    subassembly: right_leg
    part: R_foot_boot_shell
    direction:
    - 0.0
    - 1.0
    - 0.0
    after:
    - right_leg:p059
    status: seeded
    notes: 'T-6c2e93: toe part of the boot (split at y = 15.5 mm), the last thing on the foot: slides on from the toe along +y over the
      finished foot, after the monocoque case screws (s040, s041) and the foot-roll horn screws (s038) are driven. Was p049 along +z, which
      no direction allowed (the closed boot sat 10.8 cm3 inside the monocoque sole plate and the roll servo case at standing).'
  - id: right_leg:p061
    subassembly: right_leg
    part: R_foot_boot_heel_shell
    direction:
    - 0.0
    - -1.0
    - 0.0
    after:
    - right_leg:p060
    status: seeded
    notes: 'T-6c2e93: heel cap of the boot, slides on from behind along -y and butts against the toe part at the 0.4 mm seam (0.2 until review rv-jh7fcm: each half is located by its own screw tab, so the seam takes the FDM length error of the monocoque and both halves).'
  - id: left_leg:p060
    subassembly: left_leg
    part: L_foot_boot_shell
    direction:
    - 0.0
    - 1.0
    - 0.0
    after:
    - left_leg:p059
    status: seeded
    notes: 'T-6c2e93: mirror of right_leg:p060 (toe part of the boot, slides on from the toe along +y, last on the foot).'
  - id: left_leg:p061
    subassembly: left_leg
    part: L_foot_boot_heel_shell
    direction:
    - 0.0
    - -1.0
    - 0.0
    after:
    - left_leg:p060
    status: seeded
    notes: 'T-6c2e93: mirror of right_leg:p061 (heel cap, slides on from behind along -y).'
  - id: right_leg:s062
    subassembly: right_leg
    screw: R_foot_boot_toe_PA2x8
    with:
    - R_foot_boot_toe_M2_washer
    direction: screw axis
    after:
    - right_leg:p060
    status: designer
    notes: 'T-jh7fcm: the toe part''s retention screw, driven from the front along +y on its ISO 7089 washer (put on the shank first) through
      the tab''s clearance hole into the monocoque''s toe boss (hex key, head and washer in the counterbore at the toe tip).'
  - id: right_leg:s063
    subassembly: right_leg
    screw: R_foot_boot_heel_PA2x8
    with:
    - R_foot_boot_heel_M2_washer
    direction: screw axis
    after:
    - right_leg:p061
    status: designer
    notes: 'T-jh7fcm: the heel cap''s retention screw, driven from behind along -y on its ISO 7089 washer (put on the shank first) through the
      tab''s clearance hole into the monocoque''s heel boss.'
  - id: left_leg:s062
    subassembly: left_leg
    screw: L_foot_boot_toe_PA2x8
    with:
    - L_foot_boot_toe_M2_washer
    direction: screw axis
    after:
    - left_leg:p060
    status: designer
    notes: 'T-jh7fcm: the toe part''s retention screw, driven from the front along +y on its ISO 7089 washer (put on the shank first) through
      the tab''s clearance hole into the monocoque''s toe boss (hex key, head and washer in the counterbore at the toe tip).'
  - id: left_leg:s063
    subassembly: left_leg
    screw: L_foot_boot_heel_PA2x8
    with:
    - L_foot_boot_heel_M2_washer
    direction: screw axis
    after:
    - left_leg:p061
    status: designer
    notes: 'T-jh7fcm: the heel cap''s retention screw, driven from behind along -y on its ISO 7089 washer (put on the shank first) through the
      tab''s clearance hole into the monocoque''s heel boss.'
config:
  # robot/body/ape-proportions/shells.py module constants (moved 2026-11-24)
  CLEARANCE:
    value: 2.0
  PITCH:
    value: 0.75
  HIP_LINKS:
    value: [pitch_link, roll_link, shin]
  TORSO_SHELLS:
    value: [center_front_shell, center_back_shell]
  ANKLE_LINKS:
    value: [shin, ankle_pitch]
  SKIP:
    value: [cut_material, adhesive_allocation, authored_harness]
  BOOT_STATIC_CLEARANCE:
    value: 1.0
    doc: mm keep-out round the foot's own parts (a cover, not a fit); the 0.75 mm voxel grid and the smoothing
  BOOT_SPLIT_Y:
    value: 15.5
    doc: 'eat part of it: measured 2026-11-23 (review rv-6c2e93) min 0.13 mm heel cap to monocoque, 0.36 mm toe part mm, manifest frame: toe part (y < split) slides on along +y, heel cap along -y (T-6c2e93);'
  BOOT_SPLIT_GAP:
    value: 0.4
    doc: 'measured 2026-11-23 on the selected body: both halves free along their paths for a split between y 14.8 and 16.3 (below it the heel cap meets the ankle coupler, above it the toe part the monocoque) mm seam between the two halves (butt joint). Each half is located by its own screw tab at the far end'
  BOOT_MIN_BODY_MM3:
    value: 200.0
    doc: '(toe face y -63.25, heel face y 44.35), so the seam takes the length error of the monocoque between the boss faces (107.6 mm) and of both halves (78.7 + 28.8 mm): about +-0.3 mm in FDM (review rv-jh7fcm); 0.2 could close before a tab seats, 0.4 keeps both halves'' ends inside the split window above bodies smaller than this left over by the voxel cuts are loose crumbs, dropped'
  BOOT_SCREW_POINT:
    value: 0.5
    doc: tip length the engagement counts as not threaded (robot/body/checks/data/hardware.json point_mm)
  BOOT_HOLE_D:
    value: 2.4
    doc: plain clearance hole through the tab (ISO 273 medium for M2 / PA2)
  BOOT_TAB_T:
    value: 2.9
    doc: printed tab under the washer, from the boss face to the washer seat
  BOOT_TAB_TOL:
    value: 0.2
    doc: FDM tolerance on the tab thickness the stack is checked over
  BOOT_CB_D:
    value: 5.4
    doc: 'washer counterbore: d2 5.0 + 2 x 0.2 radial clearance (as the head carrier''s washer counterbores)'
  BOOT_BOSS_HW:
    value: 4.0
    doc: boss half width (x)
  BOOT_TAB_HW:
    value: 4.6
    doc: 'tab half width (x): counterbore r 2.7 + 1.9 wall, wider than the boss so the countersink keeps'
  BOOT_TAB_HH:
    value: 4.0
    doc: 'tab half width (x): counterbore r 2.7 + 1.9 wall, wider than the boss so the countersink keeps'
  BOOT_CSK_HALF_ANGLE:
    value: 45.0
    doc: 'its side walls (at 4.0 the walls beside a 0.8-1.1 toe countersink came to 0.7-1.0 mm); tab depth below the axis (z): r 2.7 + 1.3 wall; the tab runs up to the skin above it (fills the toe tip / heel, no slot) Countersink at the counterbore mouth (review rv-jh7fcm): the toe skin slopes back over the bore (about 50 deg in the x = axis section), so the plain dia 5.4 bore left a feather edge at the top of its rim (2.7 / 4.2 mm2 under one 0.62 mm line R / L, down to 0.003 mm). A 90 deg countersink whose axis is the normal of the skin round the rim (plane fitted to the skin crossings at the counterbore radius) meets the skin at 135 deg all round and the bore at an obtuse angle; it stays BOOT_CSK_SEAT_KEEP outward of the washer seat, so seat and stack do not change. Measured 2026-11-23 on the pre-tab halves (reviewer''s local ray-cast, rim within r 6 mm): chamfer 0.5 / 0.7 / 0.9 / 1.0 / 1.1 -> thinnest rim wall R 0.61 / 0.80 / 1.02 / 0.98 / 0.90, L 0.48 / 0.68 / 0.82 / 0.92 / 1.03 mm (tab half width 4.6); the rest under 2 lines is the roof between the bore top and the skin above it, which rises at about 50 deg. Heels: nothing under one line without it, and a countersink adds nothing measurable there (left plain). deg from the countersink axis (90 deg included)'
  BOOT_CSK_SEAT_KEEP:
    value: 0.3
    doc: mm the countersink stays outward of the washer seat
  BOOT_BOSS_LEN:
    value: 7.5
    doc: boss depth behind its face, boss top above the axis (pilot r 0.85 + 1.75), boss base (plate bottom)
  BOOT_BOSS_TOP:
    value: 2.6
    doc: boss depth behind its face, boss top above the axis (pilot r 0.85 + 1.75), boss base (plate bottom)
  BOOT_BOSS_Z0:
    value: 2.0
    doc: boss depth behind its face, boss top above the axis (pilot r 0.85 + 1.75), boss base (plate bottom)
  BOOT_PILOT:
    value: [1.7, 6.0]
    doc: pilot dia (85 % of the PA2 major) and depth from the boss face (1.5 mm of boss behind it)
  BOOT_SKIN_SINK:
    value: 0.4
    doc: the tab starts this far under the outer skin (no outward change)
  HARDWARE_MATERIAL:
    value: Steel 304 sleeve
    doc: Material (robot/body/checks/data/materials.json entry) of steel hardware this builder writes (sleeves, screws, washers) when the part's entry names none.
