    status: designer
    derived: 'T-9wjdqc / T-sns4zt: the head unit built on the bench (neck_head_bench: cradle, carrier and every head internal but the two
      cameras) goes onto the pitch case as one part, slid on from the +x side (the U opens toward -x): the cradle''s rear plate along the
      case''s rear face (its 4 M2 clearance holes onto the case''s rear holes), its tongue in front of the case, its bridge ends beside the case''s +x
      face (x 3.25 vs 3.0), the carrier and the internals in front of and above the case (y < 5.64, z >= 409); then the cradle''s M2x5 are
      driven from behind the case (neck_head:s008). Lowered from above (-z) is free as well. Before, the fan leads, thermal pad, header and fan
      cap went in on the neck before the carrier and the board they belong to, and the rest of the internals after it on the neck.'
  - id: neck_head:s008
    subassembly: neck_head
    screw:
    - upper__neck_head_M2x5_0
    - upper__neck_head_M2x5_1
    - upper__neck_head_M2x5_2
    - upper__neck_head_M2x5_3
    with:
    - upper__neck_head_M2_washer_0
    - upper__neck_head_M2_washer_1
    - upper__neck_head_M2_washer_2
    - upper__neck_head_M2_washer_3
    direction: screw axis
    after:
    - neck_head:p007
    status: designer
    derived: 'T-acpw7j: 4 ISO 7380-1 M2x5, each through an ISO 7089 M2 washer (put the washer on the screw first), from behind the case (-y
      along the axis) through the cradle rear plate''s plain 2.4 mm holes into the case''s M2 taps, right after the head unit is on
      (neck_head:p007). The taps are DP2 (2.0 mm deep from the case face, all four alike); the 2.5 mm plate ends the full thread 0.3 mm
      short of the tap bottom (pitch_case_joint.json tip_allowance_mm, review rv-acpw7j): 1.5 mm of full thread engaged below the 0.2 mm
      mouth chamfer, the 0.5 mm point in the drill cone, 0.2 mm clear of it; with the washer forgotten the thread would end at the tap
      bottom.'
    notes: 'Hand check before driving: with the washer and the cradle plate on the screw, the thread stands out no more than 2.2 mm past the
      plate''s case face (design 2.2; at 2.5 the full thread reaches the 2.0 mm tap bottom, so more than about 2.4 means a longer screw, a
      missing washer or a thin plate). Snug by hand with a
      short key: the taps are in the servo''s plastic case and the washer bears on the printed plate (no torque value in the repo for M2
      into the XM335 case).'
  - id: neck_head_bench:s006
    subassembly: neck_head_bench
    screw:
    - compute_M2p5x12_2
    - compute_M2p5x12_3
    with:
