    status: designer
    derived: 'T-sns4zt: the upper M2.5 x 25 from the carrier front (hex key 2) through the carrier column, the board, the standoff and the fan bridge
      plate into the nut behind the plate, on the bench once the fan unit is on (neck_head_bench:p013); the B0196 camera (on the neck, later)
