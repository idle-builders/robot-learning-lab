      mating screws / servo parts (holes patches, follow the part); the pressed-in sleeves are steel bore-collar regions (0.85 mm around each
      sleeve bore of the companion part; the companions are not bonded in the mesh). Variants legacy_coordinates / legacy_coordinates_coarse keep
