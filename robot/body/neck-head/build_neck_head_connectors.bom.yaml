compose:                           # edits of the manifest composed by roll_flip_checks.py manifest (robot/body/bom/compose.py)
- id: neck-parts
  into: roll-flip
  call: robot/body/neck-head/neck_parts.py:apply
  takes: manifest
  after: [hip-screws]
  notes: rebuilt XM335 neck connectors + their screws, when built (T-6dvwjq)
# Joint ranges of the neck: the single source of these ranges (owner 2026-11-23); see robot/body/bom/bom_config.py.
joints:
- match: neck_yaw
  range_deg: [-60.0, 60.0]
  doc: Neck yaw (was hard-coded in neck-head/package_and_render.py).
- match: neck_pitch
  range_deg: [-30.0, 35.0]
  doc: Neck pitch (was hard-coded in neck-head/package_and_render.py).
config:
  # robot/body/neck-head/build_neck_head_connectors.py module constants (moved 2026-11-24)
  RIB_HEIGHT:
    value: 3.5
    doc: 'dorsal rib height above the 2.5 mm rear plate (was 1.5): recovers the strength the thinner plate cost'
  TONGUE_X_MIN:
    value: -5.0
    doc: '============================================================================== STAGE 3: `stage3_neck_pitch_to_head_cradle` (on `head`) ============================================================================== @lore Stage 3 tongue (T-9wjdqc): the 2 brass M3 x 4 heat-set inserts fill the tongue from its rear face (the carrier''s seat, y -12.92) to its front face, so the tongue is exactly one insert long; its -x edge at -5.0 keeps 2.15 mm round the 4.0 mm holes at x -0.85 (the front corner there is rounded 0.8, not 1.6: a 1.6 corner left 0.55 mm at the front lip); its top at 423.0 keeps 2.0 mm over the upper hole (z 419): the carrier is all behind y -12.9 there and the bridge behind the tongue stays at 421.2 under the carrier plate (z >= 422).'
  TONGUE_TOP:
    value: 423.0
    doc: '============================================================================== STAGE 3: `stage3_neck_pitch_to_head_cradle` (on `head`) ============================================================================== @lore Stage 3 tongue (T-9wjdqc): the 2 brass M3 x 4 heat-set inserts fill the tongue from its rear face (the carrier''s seat, y -12.92) to its front face, so the tongue is exactly one insert long; its -x edge at -5.0 keeps 2.15 mm round the 4.0 mm holes at x -0.85 (the front corner there is rounded 0.8, not 1.6: a 1.6 corner left 0.55 mm at the front lip); its top at 423.0 keeps 2.0 mm over the upper hole (z 419): the carrier is all behind y -12.9 there and the bridge behind the tongue stays at 421.2 under the carrier plate (z >= 422).'
  TONGUE_CORNER_R:
    value: 0.8
    doc: '============================================================================== STAGE 3: `stage3_neck_pitch_to_head_cradle` (on `head`) ============================================================================== @lore Stage 3 tongue (T-9wjdqc): the 2 brass M3 x 4 heat-set inserts fill the tongue from its rear face (the carrier''s seat, y -12.92) to its front face, so the tongue is exactly one insert long; its -x edge at -5.0 keeps 2.15 mm round the 4.0 mm holes at x -0.85 (the front corner there is rounded 0.8, not 1.6: a 1.6 corner left 0.55 mm at the front lip); its top at 423.0 keeps 2.0 mm over the upper hole (z 419): the carrier is all behind y -12.9 there and the bridge behind the tongue stays at 421.2 under the carrier plate (z >= 422).'
  PLATE_Z_BOTTOM:
    value: 388.5
    doc: the U-profile's (rear plate's) bottom face
  X_BRIDGE:
    value: 8.8
    doc: the U-profile's +x face (right bridge)
  # robot/body/neck-head/neck_parts.py module constants (moved 2026-11-24)
  STAGE:
    value: {neck_root_cradle: stage1_neck_root_cradle, neck_yaw_to_pitch_link: stage2_neck_yaw_to_pitch_link, neck_pitch_to_head_cradle: stage3_neck_pitch_to_head_cradle, head_sensor_compute_carrier: stage4_head_sensor_compute_carrier}
