    status: designer
    derived: 'T-sns4zt: 4 M2x5 from outside the link arm (hex key 1.5, driver along +x toward the servo) through the link into the pitch horn,
      once the pitch servo with its horn is on (neck_head:p006); before, they were driven with the servo not there yet. Before the head unit
      (neck_head:p007).'
  - id: neck_head:p007
    subassembly: neck_head
    part:
    - combined__neck_pitch_to_head_cradle
    - combined__neck_pitch_to_head_cradle_steel_sleeves
    - combined__head_sensor_compute_carrier
    - combined__head_sensor_compute_carrier_steel_sleeves
    - microphone_6049_v23
    - ROCK4D_official
