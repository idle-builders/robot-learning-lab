    value: {stage1_neck_root_cradle: XZ Cradle & Spine Frame on Build Plate (layer normal Y), stage2_neck_yaw_to_pitch_link: XZ 90-Degree L-Bend & Gusset Webs on Build Plate (layer normal Y), stage3_neck_pitch_to_head_cradle: XY Right-Side U-Cradle Loop on Build Plate (layer normal Z), stage4_head_sensor_compute_carrier: XZ Carrier Plate & Dorsal Ribs Flat on Build Plate (layer normal Y)}
