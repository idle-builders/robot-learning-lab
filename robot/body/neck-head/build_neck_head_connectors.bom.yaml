    - upper__neck_yaw_horn_M2x5_1
    - upper__neck_yaw_horn_M2x5_2
    - upper__neck_yaw_horn_M2x5_3
    direction: screw axis
    after:
    - neck_head:p002
    status: seeded
    derived: 4 screw(s) whose joined parts are all placed after combined__neck_yaw_to_pitch_link; driver path vs placed parts
  - id: neck_head:s005
