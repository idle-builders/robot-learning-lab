assembly:
  subassemblies:
  - name: neck_head_bench
    doc: 'Head root joint on the bench (T-9wjdqc), before anything goes on the neck: the 2 brass M3 x 4 heat-set inserts are pressed into the
      neck pitch-to-head cradle''s tongue from its front face (cradle alone, the iron''s path free; back the tongue with a flat block of 8 mm
      or less, a 10 mm block meets the bridge; trim the melt ridge on the rear face flush, it is the carrier''s seat), the head carrier (its camera / mic inserts
      set on the bench before) is lowered onto the cradle between the tongue and the bridge, and the 2 ISO 7380-1 M3x6 are driven from the
      carrier''s rear face (hex key 2). Then the head internals go onto the carrier on the bench (T-sns4zt), all from behind except the
      mic: mic board (+x from inside) and its screw, ROCK4D and its 2 M2.5 x 12, thermal tape, heatsink, socket header, the two fan-bridge
      standoffs, the heatsink guard, the fan unit (neck_head_fan_bench) and the 2 M2.5 x 25 from the carrier front. The whole head unit then
      goes onto the pitch case as one part (neck_head:p007); the two cameras go on the carrier front after that, on the neck.'
    base:
    - combined__neck_pitch_to_head_cradle
    - combined__neck_pitch_to_head_cradle_steel_sleeves
  - name: neck_head_fan_bench
    doc: 'Fan unit on the bench (T-sns4zt), built before neck_head_bench:p013 and not present at the start of any other subassembly: the fan
      with its formed leads onto the back of the fan bridge plate, its 2 M3 x 16 from the plate front (their heads end up between the plate
      and the board, so they cannot be reached once the plate is on the head), the leads laid into the lead guide and the guide''s M3 x 16.'
    base:
    - fan_bridge_plate
    - fan_bridge_plate_steel_sleeves
  steps:
  - id: neck_head_bench:p001
    subassembly: neck_head_bench
    part:
    - combined__head_sensor_compute_carrier
    - combined__head_sensor_compute_carrier_steel_sleeves
    direction:
    - 0.0
    - 0.0
    - -1.0
    status: designer
    derived: 'T-9wjdqc: the carrier''s lower tongue (x -4.2..2.5, y -12.9..-11.4) slides down behind the cradle tongue (its rear face y -12.92)
      and in front of nothing else: the cradle has no material between y -12.92 and the case face at x < 3.25, and its bridge (top 421.2) stays
      under the carrier plate (z >= 422).'
  - id: neck_head_bench:s002
    subassembly: neck_head_bench
    screw:
    - head_root_M3x6_0
    - head_root_M3x6_1
    direction: screw axis
    after:
    - neck_head_bench:p001
    status: designer
    derived: 'T-9wjdqc: 2 ISO 7380-1 M3x6 from the carrier''s rear face (hex key 2) into the cradle tongue''s heat-set inserts, on the bench:
      nothing behind the heads yet (on the neck the pitch case is 5.25 mm behind them).'
    notes: 'Snug by hand with the short arm of the key (no torque value in the repo for M3 into brass heat-set inserts): the inserts bear on
      the carrier''s front face, the screws only clamp the 1.5 mm carrier plate.'
  - id: torso:p010
    subassembly: torso
    part:
    - combined__neck_root_cradle
    - combined__neck_root_cradle_steel_sleeves
    direction:
    - 0.0
    - -1.0
    - 0.0
    after:
    - torso:p009
    status: seeded
    derived: 'graph order, fastened distance 2 from what is present (via combined__stage1_center_torso_spine_chassis_steel_sleeves); direction:
      no placed neighbour: straight down (-z); direction searched (six axes vs the seeded [0.0, 0.0, -1.0]): path contact 26.5 -> 16.5 mm out,
      seat released True -> True, max overlap 10.6 -> 191.8 mm3; moved before combined__stage4_rear_imu_adc_carrier (it touched combined__stage4_rear_imu_adc_carrier
      16.5 mm out, 191.755 mm3)'
  - id: torso:neck-anchor-screws
    subassembly: torso
    screw:
    - neck_anchor_M3x8_0
    - neck_anchor_M3x8_1
    direction: screw axis
    after:
    - torso:p010
    status: designer
    derived: 'T-jxshhv: the 2 ISO 7380-1 M3x8 from the cradle spine plate''s rear face (+y, hex key 2) into the brass inserts of the chassis
      pad, right after the cradle is placed (torso:p010): the stage 4 IMU / ADC carrier (torso:p019, 7.3 mm behind the heads) and the ADC
      board close the driver path later, so taking the cradle off means the back shell, the ADC board and the carrier first (the neck
      itself comes off the cradle at the 4 M2 screws of s035, free at standing). The inserts are
      pressed into the bare chassis before anything (subassembly torso base).'
  - id: torso:s035
    subassembly: torso
    screw:
    - upper__neck_root_M2x6_0
    - upper__neck_root_M2x6_1
    - upper__neck_root_M2x6_2
    - upper__neck_root_M2x6_3
    direction: screw axis
    after:
    - torso:p034
    status: seeded
    derived: 4 screw(s) whose joined parts are all placed after upper__neck_yaw_case_XM335; driver path vs placed parts
  - id: neck_head:s003
