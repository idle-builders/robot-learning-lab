    screw:
    - upper__neck_pitch_horn_M2x5_0
    - upper__neck_pitch_horn_M2x5_1
    - upper__neck_pitch_horn_M2x5_2
    - upper__neck_pitch_horn_M2x5_3
    direction: screw axis
    after:
