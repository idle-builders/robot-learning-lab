# Cove-50 body definition for robot/body/hip-shell/sections/leg_motion.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The leg pose library: the A-11 library poses, the key poses and the grid the hip / thigh shells and the design checks sweep
# (checks core.py, leg/thigh_shell.py, leg/roll_flip_checks.py import leg_motion). It owns no parts and runs no generator; its
# configured values are the single source of those poses. Poses beyond the declared joint ranges are stress cases, reported
# apart by the checks (beyond_declared_range), never requirements (T-jbe85r).
schema: cove50-body-definition/1
definition: leg-motion
owner: (set by the owning session)
config:
  # robot/body/hip-shell/sections/leg_motion.py module constants (moved 2026-11-24)
  J:
    value: [R_hip_pitch, R_hip_roll, R_hip_yaw, R_knee]
  KEY:
    value: {squat: [-85, 0, 0, 95], front kick: [-85, 0, 0, 0], lunge rear: [40, 0, 0, 40], leg out: [0, -45, 0, 0], cross step: [-20, 25, 30, 20], 'turn, toes out': [-20, 0, 40, 20], 'climb, toes in': [-85, -30, -30, 95]}
  LIBRARY:
    value:
      'walk: swing': [[-35, 0, 0, 40], [-15, 0, 0, 60]]
      'walk: heel strike / push-off': [[-25, 0, 0, 5], [20, 0, 0, 30]]
      'walk: weight shift / turn': [[0, -8, 0, 10], [0, 8, 0, 10], [-25, 0, 15, 20], [-25, 0, -15, 20]]
      high knee / jump landing: [[-70, 0, 0, 95], [-60, -10, 0, 95]]
      squat / sit: [[-85, 0, 0, 95]]
      wide squat, toes out / in: [[-85, -20, 25, 95], [-85, -20, -25, 95]]
      front kick: [[-85, 0, 0, 0], [-85, 0, 0, 30]]
      lunge, rear leg: [[40, 0, 0, 0], [40, 0, 0, 40]]
      side step / leg out: [[0, -45, 0, 0], [-30, -45, 0, 30], [-30, -30, 20, 30]]
      cross step: [[-20, 25, 30, 20], [-20, 25, -30, 20]]
      turn in place: [[-20, 0, 40, 20], [-20, 0, -40, 20], [0, -10, 40, 0], [0, -10, -40, 0]]
      ape crouch: [[-70, -20, 20, 95], [-70, -20, -20, 95]]
      climb step: [[-85, -30, 30, 95], [-85, -30, -30, 95]]
    unit: deg
    doc: 'A-11: realistic whole-leg poses, (pitch, roll, yaw, knee) in deg; pitch < 0 = flexion, roll < 0 = leg out, yaw > 0 = right toes out (yaw +30 moves the toe to +x), knee > 0 = bent. Both yaw signs where the motion can go either way. Left leg stays standing (A-13). Poses beyond the declared joint ranges are stress cases (checks: beyond_declared_range).'
  GRID_AXES:
    value: [[-85, -60, -30, 0, 20, 40], [-45, -25, 0, 25], [-40, 0, 40], [0]]
    unit: deg
    doc: 'A-12: every combination of these (pitch, roll, yaw, knee) values (conservative bound).'
