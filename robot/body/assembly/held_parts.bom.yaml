# Cove-50 body definition for robot/body/assembly/held_parts.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: held-parts
owner: (set by the owning session)
generators:
- id: held-parts
  command:
  - .venv/bin/python
  - -B
  - robot/body/assembly/held_parts.py
  - build
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  outputs:
  - artifacts/robot/body/assembly/held-parts/records.json
  - artifacts/robot/body/assembly/held-parts/parts
  notes: 'Parts nothing held (T-3npyjq): the fan bridge plate + sleeves and the fan''s two upper screws re-seated on it, the chest indicator rebuilt
    to fill its pocket (printed with the front shell), the R roll case''s invalid vendor solid rebuilt from its outer shell, the stale r1 front-shell
    screws and the fan''s lower right screw stack dropped; roll_flip_checks manifest swaps them in. Reads the indicator, case and fan sources
    named by the shell-pass manifest.'
  after:
  - shell-pass
parts:
- match: ape_body_shell__chest_indicator_relief4_r33
  kind: printed
  line: print:ape_body_shell__chest_indicator_relief4_r33
  name: ape_body_shell__chest_indicator_relief4_r33
  make_buy: make
  quantity: 1
- match: R_roll_servo_case_reference
  kind: purchased
  line: servo:Feetech-STS3250-strong-tier
  name: Feetech STS3250 (strong tier)
  make_buy: buy
  quantity: 1
  supplier: Feetech
  part_number: ST-3250-C001
  notes: 'Grouped by the manifest motor field (same parts as the generated line). Feetech is the maker; no single seller recorded. supplier from
    robot/model/motor-map/motor-map.json (tiers.strong.part: "sellers also list C002"; price_basis names AliExpress and OpenELAB listings) and
    robot/actuators/catalog.yaml (feetech-sts3250-c001).'
  exact_fit:
    min_solid_mm3: 4000.0
  heat_source:
    kind: servo_case
- match: fan_bridge_plate
  kind: printed
  line: print:fan_bridge_plate
  name: fan_bridge_plate
  make_buy: make
  quantity: 1
  process:
    printer: Bambu X2D
    material: Bambu PAHT-CF
    up: +y
    material_alternatives:
    - Bambu PETG-CF
    set_by: 'claude/opus-5.5 2026-11-22 (T-3npyjq): 2 mm flat plate, printed flat on its y-min face'
  expected_hardware:
    sleeves: 4
- match: fan_bridge_plate_steel_sleeves
  kind: hardware
  line: steel-sleeve-sets
  name: Steel sleeve sets (CAD parts; the sleeves are bought by size, see contains)
  make_buy: context
  quantity: 1
  contains:
  - line: sleeve:3.9x2.7x2
    name: 304 steel compression sleeve 3.9 x 2.7 x 2 mm (outer x inner x length)
    quantity: 2
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 3.9
      inner_dia_mm: 2.7
      length_mm: 2.0
    supplier: unknown
    part_number: unknown
  - line: sleeve:4.5x3.2x2
    name: 304 steel compression sleeve 4.5 x 3.2 x 2 mm (outer x inner x length)
    quantity: 2
    make_buy: buy
    spec:
      kind: sleeve
      standard: 304 stainless compression sleeve
      outer_dia_mm: 4.5
      inner_dia_mm: 3.2
      length_mm: 2.0
    supplier: unknown
    part_number: unknown
- match:
  - fan_plate_M3x16_-21_462
  - fan_plate_M3x16_11_462
  kind: hardware
  line: hw:M3-x-16-ISO-7380-1
  name: M3 x 16 ISO 7380-1
  make_buy: buy
  quantity: 2
  spec:
    kind: screw
    thread: M3
    family: M
    length_mm: 16.0
    standard: ISO 7380-1
    head_dia_mm: 5.7
    head_height_mm: 1.65
    label: M3 x 16 ISO 7380-1
  supplier: unknown
  part_number: M3 x 16 ISO 7380-1
  notes: 'Standard part: the designation is the part number (thread x length, head standard ISO 4762 / 7380-1 / 7045 / 10642, or ISO 4032 nut,
    from robot/body/bom/hardware.py). PA = thread-forming screw for plastics (robot/actuators/interfaces/standard-parts.json) with the named head
    form. Supplier: no repo source (unknown).'
assembly:
  steps:
  - id: neck_head:p018
    subassembly: neck_head
    part:
    - fan_bridge_plate
    - fan_bridge_plate_steel_sleeves
    direction:
    - 0.0
    - -1.0
    - 0.0
    after:
    - neck_head:p017
    status: seeded
    derived: 'graph order, fastened distance 7 from what is present (via combined__head_sensor_compute_carrier); direction: mean screw direction
      of 2 screw(s) joining it to placed parts (compute_M2p5_CS30), head to tip when the part carries the head, else reversed'
  - id: neck_head:s025
    subassembly: neck_head
    screw: fan_plate_M3x16_-21_462
    with:
    - fan_nut_-21_462
    - fan_washer_-21_462
    direction: screw axis
    after:
    - neck_head:p024
    status: seeded
    derived: 1 screw(s) whose joined parts are all placed after SameSky_4010_fan; driver path vs placed parts; moved after s025 (its part SameSky_4010_fan
      blocked that screw's driver path, 12.031 mm3)
  - id: neck_head:s026
    subassembly: neck_head
    screw: fan_plate_M3x16_11_462
    with:
    - fan_nut_11_462
    - fan_washer_11_462
    direction: screw axis
    after:
    - neck_head:s025
    status: seeded
    derived: 1 screw(s) whose joined parts are all placed after SameSky_4010_fan; driver path vs placed parts; moved after s025 (its part SameSky_4010_fan
      blocked that screw's driver path, 12.031 mm3)
  - id: right_leg:p010
    subassembly: right_leg
    part:
    - R_roll_servo_case_reference
    - R_roll_upper_horn_reference
    - R_roll_passive_idler_reference
    direction:
    - 0.0
    - 0.0
    - 1.0
    after:
    - right_leg:s009
    status: designer
    derived: 'hip order (lead 2026-11-20, roll-flip designer): the roll servo with its horn and idler as one unit rises into the Stage 5 U from
      below (+z): the arms'' inner faces are 0.10 mm clear of the horn / idler faces per side (running fit), the screws close it; the case''s
      rear stub (r 3.0, 0.45 proud of the rear arm face) runs up a 0.6 mm insertion slot in the rear arm (2026-11-22)'
  - id: final_body:p008
    subassembly: final_body
    part: ape_body_shell__chest_indicator_relief4_r33
    direction:
    - 0.0
    - 1.0
    - 0.0
    after:
    - final_body:s007
    status: seeded
    derived: 'graph order, fastened distance 20 from what is present (via center_front_shell); direction: toward the centroid of placed neighbours
      (center_front_shell), snapped to the nearest axis; direction searched (six axes vs the seeded [0.0, 0.0, -1.0]): path contact 60.0 -> 0.0
      mm out, seat released True -> True, max overlap 62.2 -> 9.6 mm3'
defects:
- id: old-study-torso-power
  kind: no_scripted_step
  parts:
  - ape_body_shell__chest_indicator_relief4_r33
  - Main_H1_2mm_front_spacer
  - Main_H2_2mm_front_spacer
  state: STEP in artifacts/cove50-power-integration/internal-r33-20261025/installed-torso-r8|r9 (not a pinned input). Code at commit b46960e7b
    / ebc1c3118 (robot/power-integration/cad/internal-r33-20261025, private history), not in the tree.
  fix: 'Spacers: one parametric extrusion each (small). Chest indicator relief: port the relief cut from the r33 builder into the torso shell
    script, or drop it if the r33 indicator is no longer fitted (small).'
  effort: small
