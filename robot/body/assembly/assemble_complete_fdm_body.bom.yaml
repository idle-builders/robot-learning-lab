# Cove-50 body definition for robot/body/assembly/assemble_complete_fdm_body.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: assemble-complete-fdm-body
owner: (set by the owning session)
generators:
- id: assembly
  command:
  - .venv/bin/python
  - -B
  - robot/body/assembly/assemble_complete_fdm_body.py
  - --no-renders
  inputs:
  - artifacts/robot/body/leg/complete_leg_hip_combined/parts.json
  - artifacts/robot/body/leg/complete_leg_hip_combined/cad-manifest.json
  - artifacts/robot/body/leg/complete_leg_hip_combined/assembly-with-full-shell.glb
  - artifacts/robot/body/leg/combined/parts/R_shin_combined.step
  - artifacts/robot/body/arm/combined/assembly-parts.json
  - artifacts/robot/body/arm/combined/manifest.json
  - artifacts/robot/body/neck-head/combined/assembly-parts.json
  - artifacts/robot/body/neck-head/combined/manifest.json
  - artifacts/robot/body/torso/combined/assembly-parts.json
  - artifacts/robot/body/torso/combined/manifest.json
  - artifacts/cove50-electronics-integration/r1-20261026/assembly-parts.json
  - artifacts/cove50-fitted-shell/r1-20261027/panels/T01_chest.step
  - artifacts/cove50-fitted-shell/r1-20261027/panels/T02_back.step
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-crawl-wrist-seats-r1/palm_lower.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-gear-r0/palm_upper.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-crawl-r1/right_finger.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-crawl-r1/left_finger.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/lead-twin-crawl-r1/cad/assembly.glb
  outputs:
  - artifacts/robot/body/assembly/assembly-parts.json
  - artifacts/robot/body/assembly/parts
  - artifacts/robot/body/assembly/subsystem-rollup.json
  - artifacts/robot/body/assembly/whole-body-verification-report.json
  manifest_out: artifacts/robot/body/assembly/assembly-parts.json
  resources:
    limit_gb: 6
    timeout_s: 2400
  notes: 'Also reads every native_step / mesh named by the section manifests (old artifacts/cove50-strength/... paths resolve through infra/storage/path-moves.json).
    Compiles robot/electronics/power/cad/zbuffer_renderer.cpp for its renders. Every data output (assembly-parts.json, parts/, bom.json, verification
    report, manifest.json) is written before the final render phase; on 2026-11-20 the render phase went past 6 GB (peak 6.24) and memguard stopped
    it after the data was complete. Cap 10 GB for that render phase (peaks 6.24 and 8.22 GB on 2026-11-20), so a chain run does not stop at step
    1. Runs with --no-renders: the presentation figures are the separate generator assembly-renders.'
- id: assembly-renders
  command:
  - .venv/bin/python
  - -B
  - robot/body/assembly/assemble_complete_fdm_body.py
  rebuild: false
  presentation: true
  inputs:
  - artifacts/robot/body/leg/complete_leg_hip_combined/parts.json
  - artifacts/robot/body/leg/complete_leg_hip_combined/cad-manifest.json
  - artifacts/robot/body/leg/complete_leg_hip_combined/assembly-with-full-shell.glb
  - artifacts/robot/body/leg/combined/parts/R_shin_combined.step
  - artifacts/robot/body/arm/combined/assembly-parts.json
  - artifacts/robot/body/arm/combined/manifest.json
  - artifacts/robot/body/neck-head/combined/assembly-parts.json
  - artifacts/robot/body/neck-head/combined/manifest.json
  - artifacts/robot/body/torso/combined/assembly-parts.json
  - artifacts/robot/body/torso/combined/manifest.json
  - artifacts/cove50-electronics-integration/r1-20261026/assembly-parts.json
  - artifacts/cove50-fitted-shell/r1-20261027/panels/T01_chest.step
  - artifacts/cove50-fitted-shell/r1-20261027/panels/T02_back.step
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-crawl-wrist-seats-r1/palm_lower.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-gear-r0/palm_upper.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-crawl-r1/right_finger.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/A/twin-crawl-r1/left_finger.brep
  - artifacts/cove50-engineering-competition/hand-radical-20261026/lead-twin-crawl-r1/cad/assembly.glb
  outputs:
  - artifacts/robot/body/assembly/renders
  resources:
    limit_gb: 12
    timeout_s: 2400
  notes: 'Presentation only: the same build plus the whole-body Z-buffer and engineering figures (renders/). The render phase holds every mesh
    in mm plus a posed copy per panel; it peaked at 10.4 GB on 747 rows (2026-11-22). Not part of the body rebuild.'
