# APE0 body definition for robot/body/assembly/neck_collar.py (schema robot/body/bom/schema.json, guide robot/body/bom/README.md).
# The agents who own this builder maintain this file: what the builder generates from what (generators), which manifest
# parts it owns and what each is (parts: make / buy, spec, supplier or unknown, never guessed), and how they go together
# (assembly). robot/body/bom/build.py and the checks only read it and report what is missing, naming this file.
# Initial content migrated 2026-11-22 (Idle T-ghvncz) from chain.json, lines.json, the hardware specs, the sleeve STEPs and
# assembly_order.json; part ownership by the generator whose output folder holds the part's file.
schema: cove50-body-definition/1
definition: neck-collar
owner: (set by the owning session)
generators:
- id: neck-collar
  command:
  - .venv/bin/python
  - -B
  - robot/body/assembly/neck_collar.py
  - build
  inputs:
  - artifacts/robot/body/ape-proportions/shell-pass/assembly-parts.json
  - artifacts/robot/body/neck-head/parts/combined__neck_yaw_to_pitch_link.step
  outputs:
  - artifacts/robot/body/assembly/neck-collar/records.json
  - artifacts/robot/body/assembly/neck-collar/parts
  notes: 'head_neck_collar screwed to the neck yaw-to-pitch link (T-a2mt33, T-6rr3sa): inward tab to a 1.1 mm boss on the link plate (thread 4.6 deep), one 3.6/2.2 x 3.5
    steel sleeve at the collar''s mid height with a teardrop roof, a vertical flat channel in the outer wall (screw head and the press tip), one M2x8 screw, a dia 1.6
    pilot in the link, and a locating ridge on the tab face that stands in a groove of the link boss (anti-rotation, slides in along y with the collar); the collar is a
    parametric B-rep with a native STEP (ring cut by ruled splines measured from the old head-envelope mesh; neck_collar_envelope.json, with the notch and head
    cut re-measured over the head poses by `neck_collar.py sweep`); reads only the shell-pass manifest and the neck-head link STEP; roll_flip_checks swaps
    its records in after neck_parts.'
  after:
  - shell-pass
parts:
- match: head_neck_collar
  kind: printed
  line: print:head_neck_collar
  name: head_neck_collar
  make_buy: make
  quantity: 1
  process:
    printer: Bambu X2D
    material: Bambu PAHT-CF
    nozzle_mm: 0.4
    nozzle_set_by: 'builder/opus-5.5 2026-11-22 (T-6rr3sa): 0.4 mm (line 0.42): the 0.6 mm default of PAHT-CF puts the 0.8 - 1.2 mm channel and notch-floor walls under two 0.62 mm lines'
    material_alternatives:
    - Bambu PETG-CF
    material_set_by: 'builder/opus-5.5 2026-11-22 (T-6rr3sa): PAHT-CF like the link it is screwed to; PETG-CF (HDT 68 C at 1.8 MPa) left a -2.0 C margin against the neck
      pitch servo case (70 C assumed worst case, 5.8 mm away, no contact)'
    up: +z
    set_by: 'builder/opus-5.5 2026-11-22 (T-vjw5z8): +z (ring base flange z 394.2 on the bed) chosen from the six axes measured on the native
      STEP (overhang beyond 70 deg / bed contact / support standing on the part): +z 15.1 mm2 / 712 mm2 / 15 mm2 (only the sleeve-bore tops of
      the screw tab), -z 159 / 0 / 13, +x 243 / 0 / 113, -x 274 / 0 / 158, +y 132 / 0 / 12, -y 83 / 0 / 24; the head-envelope edge is a curve,
      so only the flange gives a flat bed face. T-6rr3sa: with the 45 deg bore roof the +z overhang beyond 70 deg is 0 mm2 (bed contact 472 mm2 at 0.2 mm layers)'
  section: Neck / head
  fem:
    _doc: 'Body shell (T-6rr3sa, builder/opus-5.5 2026-11-22): the collar carries no head load (the head rests on the neck pitch cradle); it is held by its one
      screw through the 3.6 / 2.2 x 3.5 sleeve and its ridge (in a groove of the link boss) to the link and is loaded by what can touch it: the head skin pressing on its rim (the skin sits 0.9 mm
      off, a hand pushing the head down) and a sideways push on the same rim. Supports = the part''s own sleeve bore at the link and the ridge flanks (the ridge sits 0.25 mm off its groove: a rotation of about 4 deg closes it; the setup treats it as in contact), load = the rim surface
      within 2 mm of the head skin (T-6rr3sa round 3: the smoothed rim leaves the one site at theta 8, x +28; round 2 also loaded theta 172, x -30), wrench at the load patch centroid. 0.7 mm steel collars around the sleeve bores. Loads are nominal assumptions
      (5 N finger press, 20 N hard press down, 10 N sideways; no stored shell setup exists to follow): they say whether the 0.8 - 2.4 mm shell walls survive a hand, not a design target.'
    mesh_h_mm: 1.2
    origin_mm: load_centroid
    materials:
    - Bambu PETG-CF
    - Bambu PAHT-CF
    regions:
    - material: Steel 304 sleeve
      where:
        bore_collars:
          of: head_neck_collar_steel_sleeves
          r_extra_mm: 0.7
          end_extra_mm: 0.25
    supports:
      link_screws:
        holes:
          of: head_neck_collar_steel_sleeves
          mate:
          - combined__neck_yaw_to_pitch_link
          gap_mm: 2.0
          r_max_mm: 5.0
          rim_mm: 2.0
      link_ridge:
        box:
          x:
          - -25.5
          - -24.5
          y:
          - 4.6
          - 16.5
          z:
          - 395.0
          - 398.2
    load:
      contact:
      - original_profile_head_skin_v23
      gap_mm: 2.0
    load_cases:
      push_down_5N:
        wrench_N_Nmm:
        - 0.0
        - 0.0
        - -5.0
        - 0.0
        - 0.0
        - 0.0
      push_down_20N:
        wrench_N_Nmm:
        - 0.0
        - 0.0
        - -20.0
        - 0.0
        - 0.0
        - 0.0
      push_side_10N:
