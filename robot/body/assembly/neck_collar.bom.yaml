      stored setup is proven by fem_setup (per-side and per-mating-part patch areas) and mesh convergence. Differences measured earlier, all four
      stages together: Old script rerun on today''s STEP (its own coarser mesher, 1573-5440 nodes) vs this module: legacy_coordinates at h 2.2
      (11921-57248 nodes) p99 +24..+66 %, peak +20..+142 %, disp +44..+111 %; legacy_coordinates_coarse (h chosen to approach the old node count,
      4534-15704 nodes) p99 +10..+31 %, peak +4..+52 %, disp +20..+42 %. Applied wrenches match the old ones exactly (stage scale, lever 0.45,
      load-centroid origin); old patch nodes 143-884 vs 299-1511 here. One change tested: mesh size (fine -> coarse) cut the gap by about half,
      so mesher/patch node selection of the old coarse mesh is the remaining cause. Stored vs legacy (same fine mesh, steel collars from the sleeve
