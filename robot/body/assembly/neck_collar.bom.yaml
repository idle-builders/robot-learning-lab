    doc: 'the ring''s bed plane: 0.6 mm under the old flange (394.2); with the inner wall 1.4 mm further in it takes the notch floor band (z BED_Z .. 395.1) to 1.5 x 6.6 mm (FEM, was 0.9 x 5.2)'
