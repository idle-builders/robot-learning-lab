  - id: neck_head:p002
    subassembly: neck_head
    part:
    - combined__neck_yaw_to_pitch_link
    - combined__neck_yaw_to_pitch_link_steel_sleeves
    direction:
    - 0.0
    - 1.0
    - 0.0
