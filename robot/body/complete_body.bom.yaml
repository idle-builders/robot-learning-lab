# The selected complete body as a design-dashboard study (schema robot/body/bom/schema.json `study`).
# robot/body/bom/publish_body.py generates the record from this block, the selected manifest (robot/design.json
# body_manifest), every body definition and the rebuild outputs (BOM, assembly order, check reports). It declares no
# parts: they come from the builders' definitions. Edit the text here when the study's story changes; a redesign needs
# no edit here.
schema: cove50-body-definition/1
definition: complete-body-study
owner: BOM / dashboard (T-zmmdkm)
doc: Study metadata of the selected complete printed body; no generators, parts or steps of its own.
study:
  study_id: cove50-complete-fdm-body
  title: Complete printed body
  robot_sections: [Whole robot, Waist / pelvis, Hip, Knee, Ankle / foot, Torso / shell, Shoulder, Elbow, Neck / head, Hand / wrist, Electronics]
  workspace: Body
  summary: >-
    The selected Cove-50 body (robot/design.json body_manifest): every part with its BOM line, files, generator,
    assembly step and latest check measurements, generated from the body definitions.
  maturity: >-
    CAD of the selected body with design-check measurements; printed and assembled hardware unmeasured.
  version_note: Selected complete printed body, generated from the body definitions
  limitations: >-
    Kinematic checks without loads or compliance; linear static FEM only where a part declares a setup; print
    tolerances, sleeve retention and harness routing unmeasured; suppliers 'unknown' where no repository source names one.
  statements:
  - {date: "2026-11-12", who: owner, text: "the motor-refit complete printed body is the selected and latest robot design", source: M-zh6fxd}
  - {date: "2026-11-17", who: owner, text: "all connectors are 3D printed; pressed-in 304 steel sleeves at the bolt holes stay bought hardware", source: M-pxbsxq}
  - {date: "2026-11-20", who: owner, text: "the BOM is generated by script from the selected manifest plus line data in Git that agents edit", source: M-cbcwsd}
  - {date: "2026-11-22", who: owner, text: "the dashboard view of the selected body is generated from the same source as the BOM, so it never drifts", source: T-zmmdkm}
  evidence:
  - {label: "BOM start page: how the BOM, assembly order and checks are regenerated", path: robot/body/bom/README.md}
  - {label: "Selected design pointer (body manifest, selections)", path: robot/design.json}
  cad:
    label: Selected complete body (display GLB of the manifest)
    show_shells: true
    overlays:
    - {id: actuators_and_hardware, label: "Motors, horns, idlers and fasteners", visible: true}
    - {id: electronics_and_battery, label: "Battery, heat fins, electronics and sensors", visible: true}
