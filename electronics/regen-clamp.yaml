alternatives:
  - name: ODrive Regen Clamp
    source: https://docs.odriverobotics.com/v/latest/hardware/regen-clamp-datasheet.html
    input_minimum_v: 10
    activation_offset_typical_v: 2.35
    activation_offset_maximum_v: 2.50
    decision: Reject as the sole 3S overvoltage clamp; at 12.6 V its activation exceeds our 14 V window, and 9 V operation is below its input range.
  - name: Pololu 3778 adjustable LV
    source: https://www.pololu.com/product/3778
    decision: Calibration alternative; adds a trim/retention process but does not resolve unqualified pulse/thermal limits.
  - name: Custom comparator, local supply, MOSFET and resistor
    source: https://www.ti.com/product/TLV3012
    decision: Deferred pending module evaluation; requires component models, SOA, fault/thermal proof, layout and production quotes.
  - name: Motor-winding flux braking
    source: https://mjbots.github.io/moteus/guides/electrical-setup/
    decision: Existing moteus feature, not established for the selected C018 smart servos; not a drop-in software remedy.
