schema_version: 1
status: prototype_component_manifest
camera:
  name: raspberry_pi_camera_module_3_wide
  drawing: docs/design/references/vision/camera-module-3-wide-mechanical-drawing.pdf
  drawing_url: https://datasheets.raspberrypi.com/camera/camera-module-3-wide-mechanical-drawing.pdf
  product_brief_url: https://pip-assets.raspberrypi.com/categories/786/raspberry-pi-camera-module-3/documents/RP-008151-DS-1-camera-module-3-product-brief.pdf
  launch_reference_url: https://www.raspberrypi.com/news/new-autofocus-camera-modules/
  source_kind: published_mechanical_drawing_and_product_brief
  dimensions_mm: [25.0, 24.0, 12.4]
  drawing_planform_mm: [25.0, 23.862]
  mounting_hole_diameter_mm: 2.2
  mounting_holes_drawing_mm:
    - [2.0, 2.0]
    - [23.0, 2.0]
    - [2.0, 14.5]
    - [23.0, 14.5]
  optic_datum_drawing_mm: [12.5, 14.4]
  frame:
    drawing_right: [+1, 0, 0]
    drawing_up: [0, +1, 0]
    lens_outward: [0, 0, +1]
    origin: front_optical_allocation
  intrinsics:
    horizontal_fov_deg: 102.0
    vertical_fov_deg: 67.0
    minimum_focus_m: 0.05
    pixels: [4608, 2592]
