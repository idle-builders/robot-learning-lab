[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-learning-lab"
version = "0.1.0"
description = "Local, parameterized humanoid design experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d==0.11.1", "mujoco==3.13.0", "pydantic==2.13.5", "PyYAML==6.0.3", "pillow==12.3.0", "scipy==1.18.1"]

[project.scripts]
robot-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]
