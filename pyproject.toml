[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-learning-lab"
version = "0.1.0"
description = "Storage, archive and dashboard library for the 50 cm ape robot lab"
requires-python = ">=3.12,<3.13"
dependencies = ["build123d==0.11.1", "mujoco==3.13.0", "pydantic==2.13.5", "PyYAML==6.0.3", "pillow==12.3.0", "scipy==1.18.1"]

[tool.setuptools.packages.find]
include = ["infra*"]
