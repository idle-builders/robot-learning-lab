controller:
  pitch_gain_m_s: 4
  pitch_rate_gain_m: 0.4
  position_gain_s_inv: 1
  velocity_gain: 1.5
  complementary_tau_s: 0.4
  wheel_velocity_gain_nm_s: 0.2
  pitch_trim: assembly_mass
  pitch_initialization: stationary_imu
cases:
- name: tilt-recovery
  sensor: &id001
    mode: lsm6dso
- name: drive-return
  initial_pitch_rad: 0
  duration_s: 16
  waypoints:
  - - 0
    - 0
  - - 3
    - 0
  - - 6
    - 0.09
  - - 9
    - 0.09
  - - 12
    - 0
  - - 14
    - 0
  sensor: *id001
