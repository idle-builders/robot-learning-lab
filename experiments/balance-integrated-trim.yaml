# Same cases and limits as balance-driver.yaml; only static mass-derived trim is enabled.
controller:
  pitch_gain_m_s: 4
  pitch_rate_gain_m: 0.2
  position_gain_s_inv: 1
  velocity_gain: 2.5
  complementary_tau_s: 0.4
  wheel_velocity_gain_nm_s: 0.2
  pitch_trim: assembly_mass
cases:
- name: tilt-recovery
  sensor: &id001
    mode: lsm6dso
- name: reverse-tilt
  initial_pitch_rad: -0.03
  sensor: *id001
- name: drive-return
  initial_pitch_rad: 0
  duration_s: 16
  waypoints:
  - - 0
    - 0
  - - 3
    - 0
  - - 6
    - 0.09
  - - 9
    - 0.09
  - - 12
    - 0
  - - 14
    - 0
  sensor: *id001
- name: bus-phase-and-poll-gaps
  sensor:
    mode: lsm6dso
    gyro_phase_us: 2400
    poll_block_us: 6000
- name: rotated-mount-corrected
  sensor:
    mode: lsm6dso
    sensor_to_torso_rpy_rad:
    - 0
    - 0
    - 1.5707963267948966
    calibration_to_torso_rpy_rad:
    - 0
    - 0
    - 1.5707963267948966
- name: noisy-biased-imu
  gyro_bias_rad_s: 0.005
  gyro_noise_std_rad_s: 0.003
  accel_noise_std_m_s2: 0.05
  seed: 42
  sensor: *id001
- name: delayed-command
  command_delay_ms: 20
  sensor: *id001
- name: io-fault
  sensor:
    mode: lsm6dso
    fault: io
- name: conversion-dropout
  sensor:
    mode: lsm6dso
    fault: dropout
- name: register-saturation
  sensor:
    mode: lsm6dso
    fault: saturation
- name: excessive-poll-block
  sensor:
    mode: lsm6dso
    poll_block_us: 30000
    poll_block_period_us: 40000
- name: wrong-mount-calibration
  sensor:
    mode: lsm6dso
    sensor_to_torso_rpy_rad:
    - 0
    - 0
    - 3.141592653589793
- name: disabled-controller
  controller_enabled: false
  sensor: *id001
- name: startup-io-fault
  sensor:
    mode: lsm6dso
    fault: io
    fault_start_s: -0.25
    fault_duration_s: 1
- name: startup-dropout
  sensor:
    mode: lsm6dso
    fault: dropout
    fault_start_s: -0.25
    fault_duration_s: 1
- name: startup-saturation
  sensor:
    mode: lsm6dso
    fault: saturation
    fault_start_s: -0.25
    fault_duration_s: 1
