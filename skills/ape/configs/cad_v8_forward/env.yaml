      mode: geom
      pattern: ^(left_hand|right_hand|left_finger_tip|right_finger_tip)$
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: false
    global_frame: false
    history_length: 0
    debug: false
