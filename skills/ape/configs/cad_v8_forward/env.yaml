    frame: !!python/tuple
    - type: site
      name: left_sole_center
      entity: robot
    - type: site
      name: right_sole_center
      entity: robot
    pattern:
      rings: !!python/tuple
      - radius: 0.03
        num_samples: 2
      include_center: true
      direction: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
    ray_alignment: yaw
    max_distance: 1.0
    exclude_parent_body: true
    include_geom_groups: !!python/tuple
    - 0
    debug_vis: false
    viz:
      hit_color: !!python/tuple
      - 0.0
      - 1.0
      - 0.0
      - 0.8
      miss_color: !!python/tuple
      - 1.0
      - 0.0
      - 0.0
      - 0.4
      hit_sphere_color: !!python/tuple
      - 0.0
      - 1.0
      - 1.0
      - 1.0
      hit_sphere_radius: 0.5
      show_rays: false
      show_normals: false
      normal_color: !!python/tuple
      - 1.0
      - 1.0
      - 0.0
      - 1.0
      normal_length: 5.0
    reduction: min
