        contype: 1
        conaffinity: 1
        condim: 3
        priority: 0
        friction: !!python/tuple
        - 1.0
        solref: null
        solimp: null
        margin: null
        gap: null
        solmix: null
        disable_other_geoms: false
  sensors: !!python/tuple
  - name: feet_ground_contact
    primary:
      mode: geom
      pattern: ^(left_sole|right_sole)$
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: true
    global_frame: false
    history_length: 0
    debug: false
  - name: hand_ground_contact
